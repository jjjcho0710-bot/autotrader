<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AutoTrader — 전략</title>
<style>
:root[data-theme="dark"]{--bg:#0d1421;--panel:#1a2332;--card:#1e2d40;--border:#2a3a4e;--text:#e8edf3;--muted:#8b95a1;--up:#f75467;--dn:#4386f9;--accent:#1763b6;--header:#111827;--green:#22c55e;--input:#243447;}
:root[data-theme="light"]{--bg:#f4f6f9;--panel:#ffffff;--card:#ffffff;--border:#e2e8f0;--text:#1a2332;--muted:#8b95a1;--up:#e02020;--dn:#1763b6;--accent:#1763b6;--header:#ffffff;--green:#16a34a;--input:#f4f6f9;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Pretendard',sans-serif;font-size:14px;}
body{display:flex;flex-direction:column;min-height:100vh;padding-bottom:70px;}

.header{background:var(--header);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;}

/* 봇 섹션 헤더 */
.bot-header{padding:12px 16px 6px;background:var(--bg);}
.bot-header-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}

/* 전략 카드 */
.strat-card{background:var(--card);border-radius:12px;margin:6px 12px;border:1px solid var(--border);overflow:hidden;}
.strat-card-header{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.strat-name{font-size:15px;font-weight:700;}
.strat-status{font-size:11px;color:var(--muted);}
.toggle-wrap{display:flex;align-items:center;gap:8px;}
.toggle{position:relative;width:44px;height:24px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#4b5563;border-radius:24px;transition:0.2s;}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.2s;}
.toggle input:checked+.toggle-slider{background:var(--accent);}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px);}
.on-label{font-size:12px;font-weight:700;color:var(--accent);}
.off-label{font-size:12px;font-weight:700;color:var(--muted);}

.strat-params{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.param-item{display:flex;flex-direction:column;gap:4px;}
.param-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.param-input{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px;font-weight:600;outline:none;width:100%;}
.param-input:focus{border-color:var(--accent);}

.strat-footer{padding:10px 14px 14px;display:flex;justify-content:space-between;align-items:center;}
.strat-stats{font-size:11px;color:var(--muted);}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.save-btn:active{opacity:0.8;}

.bottom-nav{background:var(--header);border-top:1px solid var(--border);display:flex;height:56px;position:fixed;bottom:0;left:0;right:0;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:500;}
.bn-item.active{color:var(--accent);}
.bn-icon{font-size:22px;line-height:1;}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;display:none;}
</style>
</head>
<body>

<div class="header">
  <div style="width:44px"></div>
  <div class="header-title">전략 관리</div>
  <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
</div>

<div id="strategy-container"></div>
<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <a href="dashboard-C.html" class="bn-item"><span class="bn-icon">⊞</span>대시보드</a>
  <a href="stock.html" class="bn-item"><span class="bn-icon">📈</span>주식</a>
  <a href="crypto.html" class="bn-item"><span class="bn-icon">₿</span>코인</a>
  <a href="strategy.html" class="bn-item active"><span class="bn-icon">⚙</span>전략</a>
  <a href="jarvis.html" class="bn-item"><span class="bn-icon">🤖</span>Jarvis</a>
</nav>

<script>
const API='';

function toggleTheme(){
  const h=document.documentElement;const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-icon').textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'light':'dark');
}
const t=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',t);
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('theme-icon').textContent=t==='dark'?'🌙':'☀️';});

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',2000);
}

async function toggleStrategy(bot, name, active){
  try{
    await fetch(`${API}/api/strategy/toggle`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot,name,is_active:active})});
    showToast(active?`${name} 활성화`:`${name} 비활성화`);
  }catch(e){showToast('오류 발생');}
}

async function saveParams(bot, name, params){
  try{
    await fetch(`${API}/api/strategy/params`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot,name,params})});
    showToast('저장 완료!');
  }catch(e){showToast('오류 발생');}
}

function renderStrategy(s){
  const params=typeof s.params==='string'?JSON.parse(s.params):s.params||{};
  const paramKeys=Object.keys(params).filter(k=>!['name','bot'].includes(k));
  const statusText=s.is_active?'신호 감지 중':'대기 중';
  return `<div class="strat-card">
    <div class="strat-card-header">
      <div>
        <div class="strat-name">${s.name}</div>
        <div class="strat-status">${statusText}</div>
      </div>
      <div class="toggle-wrap">
        <label class="toggle">
          <input type="checkbox" ${s.is_active?'checked':''} onchange="toggleStrategy('${s.bot}','${s.name}',this.checked)">
          <span class="toggle-slider"></span>
        </label>
        <span class="${s.is_active?'on-label':'off-label'}">${s.is_active?'ON':'OFF'}</span>
      </div>
    </div>
    <div class="strat-params" data-bot="${s.bot}" data-name="${s.name}">
      ${paramKeys.map(k=>`
        <div class="param-item">
          <span class="param-label">${k.toUpperCase()}</span>
          <input class="param-input" type="number" value="${params[k]}" data-key="${k}" step="any">
        </div>
      `).join('')}
    </div>
    <div class="strat-footer">
      <span class="strat-stats">30일 수익률 - · 승률 - · 총 체결 -</span>
      <button class="save-btn" onclick="(function(){
        const grid=this.closest('.strat-card').querySelector('.strat-params');
        const bot=grid.dataset.bot,name=grid.dataset.name;
        const inputs=grid.querySelectorAll('.param-input');
        const params={};
        inputs.forEach(i=>params[i.dataset.key]=parseFloat(i.value)||i.value);
        saveParams(bot,name,params);
      }).call(this)">파라미터 저장</button>
    </div>
  </div>`;
}

async function loadStrategies(){
  try{
    const r=await fetch(`${API}/api/strategies`);
    const d=await r.json();
    const strats=d.data||[];
    const container=document.getElementById('strategy-container');

    const bots={'stock_trader':'주식 전략 (STOCK TRADER)','crypto_trader':'코인 전략 (CRYPTO TRADER)'};
    let html='';
    for(const [bot,label] of Object.entries(bots)){
      const botStrats=strats.filter(s=>s.bot===bot);
      if(!botStrats.length)continue;
      html+=`<div class="bot-header"><div class="bot-header-title">${label}</div></div>`;
      html+=botStrats.map(renderStrategy).join('');
    }
    container.innerHTML=html||'<div style="text-align:center;padding:40px;color:var(--muted)">전략 없음</div>';
  }catch(e){console.error(e);}
}

loadStrategies();
</script>
</body>
</html>

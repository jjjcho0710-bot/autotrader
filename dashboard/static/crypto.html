<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTrader — 코인</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#12131a;--panel:#1a1c27;--panel2:#1f2133;--border:#272a3d;--stock:#5b8fff;--crypto:#f0a500;--green:#34d399;--red:#f87171;--purple:#a78bfa;--muted:#4b5270;--text:#8892b0;--bright:#e2e8f7;--grotesk:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
*::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}
body{background:var(--bg);color:var(--text);font-family:var(--grotesk);font-size:13px;height:100vh;display:flex;overflow:hidden;}
.sidebar{width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;}
.sidebar-logo{width:100%;height:52px;display:flex;align-items:center;justify-content:flex-start;padding:0 12px;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--stock),var(--crypto));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:700;font-family:var(--mono);}
.logo-text{font-size:13px;font-weight:700;color:var(--bright);font-family:var(--mono);}
.sidebar-nav{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:10px 6px;gap:2px;width:100%;}
.nav-item{width:100%;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;padding:0 10px;gap:8px;cursor:pointer;color:var(--muted);font-size:16px;transition:background 0.15s,color 0.15s;position:relative;}
.nav-item span{font-size:11px;font-weight:500;color:inherit;}
.nav-divider{width:80%;height:1px;background:var(--border);margin:4px 6px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--bright);}
.nav-item.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;}
.nav-item.c.active::before{background:var(--crypto);}
.nav-item.d.active::before{background:var(--green);}
.nav-item.s.active::before{background:var(--stock);}
.nav-item.t.active::before{background:var(--purple);}
.nav-item.l.active::before{background:var(--text);}
.nav-item.j.active::before{background:var(--purple);}
.sidebar-bottom{padding-bottom:12px;display:flex;flex-direction:column;align-items:center;width:100%;}
.sdot-group{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);width:100%;}
.sdot-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.sdot.on{background:var(--green);box-shadow:0 0 5px var(--green);}
.sdot-label{font-size:7px;color:var(--muted);font-family:var(--mono);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;flex-shrink:0;}
.page-label{font-size:14px;font-weight:600;color:var(--bright);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green);font-family:var(--mono);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.clock{font-family:var(--mono);font-size:11px;color:var(--muted);}
.page{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.page-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ph-left{display:flex;align-items:center;gap:12px;}
.ph-dot{width:10px;height:10px;border-radius:50%;background:var(--crypto);box-shadow:0 0 10px var(--crypto);}
.ph-title{font-size:15px;font-weight:700;color:var(--bright);}
.ph-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ph-pnl{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--green);}
.ph-psub{font-size:10px;color:var(--muted);margin-top:2px;text-align:right;}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border);flex-shrink:0;}
.kpi{padding:12px 18px;border-right:1px solid var(--border);}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:9px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;}
.kpi-value{font-size:17px;font-weight:700;font-family:var(--mono);line-height:1;}
.kpi-value.pos{color:var(--green);}.kpi-value.neg{color:var(--red);}.kpi-value.crypto{color:var(--crypto);}.kpi-value.bright{color:var(--bright);}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.content-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;}
.pbox{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;flex-direction:column;overflow:hidden;}
.pbox.nr{border-right:none;}.pbox.nb{border-bottom:none;}
.ptitle{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.paction{font-size:10px;color:var(--crypto);cursor:pointer;letter-spacing:0;text-transform:none;}
/* 코인 카드 */
.coin-cards{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;}
.coin-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;border-left:3px solid var(--crypto);padding:12px 14px;flex-shrink:0;}
.cc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cc-sym{font-size:14px;font-weight:700;color:var(--bright);font-family:var(--mono);}
.cc-ex{font-size:10px;color:var(--muted);}
.cc-pct{font-size:13px;font-weight:700;font-family:var(--mono);}
.cc-pct.pos{color:var(--green);}.cc-pct.neg{color:var(--red);}
.cc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cc-sl{font-size:9px;color:var(--muted);margin-bottom:3px;}
.cc-sv{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--text);}
.cc-sv.bright{color:var(--bright);}.cc-sv.pos{color:var(--green);}.cc-sv.neg{color:var(--red);}
/* 마켓 현황 */
.mkt-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;}
.mi{display:grid;grid-template-columns:22px 1fr auto auto;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;transition:background 0.1s;}
.mi:hover{background:#252840;}
.mi-rank{font-family:var(--mono);font-size:10px;color:var(--muted);}
.mi-name{font-size:12px;font-weight:600;color:var(--bright);}
.mi-code{font-size:10px;color:var(--muted);font-family:var(--mono);}
.mi-price{font-family:var(--mono);font-size:12px;color:var(--bright);text-align:right;}
.mi-chg{font-family:var(--mono);font-size:11px;font-weight:700;text-align:right;min-width:52px;}
.mi-chg.pos{color:var(--green);}.mi-chg.neg{color:var(--red);}
.mi-badge{font-size:8px;font-family:var(--mono);padding:1px 4px;border-radius:3px;margin-left:4px;}
.mi-badge.live{background:rgba(52,211,153,0.15);color:var(--green);}
.mi-badge.mock{background:rgba(240,165,0,0.15);color:var(--crypto);}
/* 이력 */
.hist-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto;}
.hist-item{display:grid;grid-template-columns:56px 44px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:6px;border:1px solid var(--border);font-size:11px;}
.h-time{font-family:var(--mono);color:var(--muted);font-size:10px;}
.h-tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;text-align:center;}
.tag-buy{background:rgba(52,211,153,0.12);color:var(--green);}
.tag-sell{background:rgba(248,113,113,0.12);color:var(--red);}
.h-name{color:var(--bright);font-weight:500;}
.h-price{font-family:var(--mono);color:var(--text);text-align:right;font-size:10px;}
.h-res{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;}
.h-res.pos{color:var(--green);}.h-res.neg{color:var(--red);}.h-res.pend{color:var(--muted);font-size:10px;}
/* 전략 */
.strat-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;}
.strat-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;flex-shrink:0;}
.strat-item.active-c{border-color:rgba(240,165,0,0.4);background:rgba(240,165,0,0.04);}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.sn{font-size:12px;font-weight:600;color:var(--bright);}
.spill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.spill.on{background:rgba(52,211,153,0.12);color:var(--green);}
.spill.off{background:rgba(75,82,112,0.3);color:var(--muted);}
.sparams{display:flex;gap:8px;flex-wrap:wrap;}
.sp{font-size:10px;color:var(--muted);font-family:var(--mono);}
.sp span{color:var(--crypto);}
.ssig{margin-top:5px;font-size:10px;display:flex;align-items:center;gap:5px;}
.sig-dot{width:5px;height:5px;border-radius:50%;}
.empty-msg{color:var(--muted);font-size:11px;padding:10px 0;}
@media(max-width:768px){.sidebar{width:100%!important;height:56px!important;flex-direction:row!important;position:fixed!important;bottom:0!important;top:auto!important;z-index:100!important;border-right:none!important;border-top:1px solid var(--border)!important;padding:0 8px!important;}.sidebar-logo{display:none!important;}.sidebar-nav{flex-direction:row!important;padding:0!important;gap:0!important;justify-content:space-around!important;width:100%!important;flex:1!important;}.nav-item{flex-direction:column!important;height:56px!important;justify-content:center!important;padding:0!important;font-size:20px!important;gap:2px!important;flex:1!important;}.nav-item span{font-size:10px!important;}.sidebar-bottom{display:none!important;}.main{padding-bottom:56px!important;}body{height:100dvh!important;}}</style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>

  <div class="sidebar-logo"><div class="logo-mark">AT</div><span class="logo-text">AutoTrader</span></div>
  <div class="sidebar-nav">
    <div class="nav-item j" onclick="location.href='jarvis.html'">🤖<span>Jarvis</span></div>

    <div class="nav-item d" onclick="location.href='dashboard-C.html'">⊞<span>대시보드</span></div>

    <div class="nav-item t" onclick="location.href='strategy.html'">⚙<span>전략</span></div>

  <div class="topbar">

  </div>

    <div class="kpi-strip">
      <div class="kpi"><div class="kpi-label">코인 평가금액</div><div class="kpi-value crypto" id="c-eval">-</div><div class="kpi-sub">원</div></div>
      <div class="kpi"><div class="kpi-label">오늘 수익</div><div class="kpi-value pos" id="c-pnl">0</div><div class="kpi-sub" id="c-pnl-sub">-</div></div>
      <div class="kpi"><div class="kpi-label">보유 코인</div><div class="kpi-value bright" id="c-pos-cnt">-</div><div class="kpi-sub">모니터링 5종</div></div>
      <div class="kpi"><div class="kpi-label">오늘 체결</div><div class="kpi-value bright" id="c-trades">-</div><div class="kpi-sub">매매</div></div>
      <div class="kpi"><div class="kpi-label">BTC 현재가</div><div class="kpi-value crypto" id="c-btc-price">-</div><div class="kpi-sub" id="c-btc-chg">-</div></div>
    </div>
    <div class="content-grid">
      <!-- 보유 코인 -->
      <div class="pbox">
        <div class="ptitle">보유 포지션<span class="paction">업비트 연동</span></div>
        <div class="coin-cards" id="c-cards"><div class="empty-msg">로딩 중...</div></div>
      </div>
      <!-- 마켓 현황 -->
      <div class="pbox nr">
        <div class="ptitle">코인 마켓 현황 <span style="color:var(--muted);font-weight:400;">(실시간)</span></div>
        <div class="mkt-list" id="mkt-list"><div class="empty-msg">로딩 중...</div></div>

      </div>
      <!-- 전략 -->
      <div class="pbox nr nb">
        <div class="ptitle">전략 상태<span class="paction" onclick="location.href='strategy.html'">전략 관리 →</span></div>
        <div class="strat-list" id="strat-list"><div class="empty-msg">로딩 중...</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';

async function fetchWithFallback(realPath, mockPath) {
  try {
    const res = await fetch(`${API}${realPath}`);
    const json = await res.json();
    const d = json.data;
    const hasData = d && (Array.isArray(d) ? d.length > 0 : Object.keys(d).length > 0);
    if (json.success && hasData) return json;
    throw new Error('empty or no data');
  } catch {
    try {
      const res = await fetch(`${API}${mockPath}`);
      return res.json();
    } catch(e2) { return { success: false, data: null }; }
  }
}

// 시계 (동적)
function updateClock() {
  const now = new Date();
  const d = now.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace('.','');
  const t = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').textContent = `${d} ${t}`;
}
setInterval(updateClock, 1000); updateClock();

const fmt = (n, p=true) => { if(n==null)return'-'; const s=n>=0?(p?'+':''):'-'; return s+Math.abs(Math.round(n)).toLocaleString(); };
const pc = n => n>=0?'pos':'neg';

// 봇 상태
async function fetchStatus() {
  try {
    const { data } = await fetchWithFallback('/api/status','/api/mock/status');
    if (!data) return;
    ['dot-stk','dot-cry','dot-dat'].forEach((id,i)=>{
      const bot=['stock_trader','crypto_trader','data_collector'][i];
      const el=document.getElementById(id);
      if(!el)return;
      const on=data[bot]?.status==='running';
      el.style.background=on?'var(--green)':'var(--red)';
      el.style.boxShadow=on?'0 0 5px var(--green)':'none';
    });
  } catch(e){}
}

// 요약
async function fetchSummary() {
  try {
    const { data } = await fetchWithFallback('/api/summary','/api/mock/summary');
    if (!data) return;
    const cp=Math.round(data.bot_pnl?.crypto_trader||0);
    const tp=Math.round(data.total_pnl||0);
    const el=id=>document.getElementById(id);
    el('ch-today-pnl').textContent=fmt(cp)+'원';
    el('ch-today-pnl').style.color=cp>=0?'var(--green)':'var(--red)';
    el('ch-total-pnl').textContent=fmt(tp,false);
    el('c-pnl').textContent=fmt(cp);
    el('c-pnl').className='kpi-value '+(cp>=0?'pos':'neg');
    el('c-trades').textContent=data.today_trades||0;
  } catch(e){}
}

// 마켓 현황 (실시간 or 모의)
async function fetchMarket() {
  try {
    const { data, source } = await fetchWithFallback('/api/prices/crypto','/api/mock/prices/crypto');
    const list=document.getElementById('mkt-list');
    if (!data||!Object.keys(data).length) { list.innerHTML='<div class="empty-msg">시세 없음</div>'; return; }

    // BTC 상단 KPI
    const btc = data['KRW-BTC'];
    if (btc) {
      const el=document.getElementById;
      el('c-btc-price').textContent=(Math.round(btc.price/10000)/100)+'억';
      el('c-btc-chg').textContent=(btc.change_rate>=0?'+':'')+btc.change_rate.toFixed(2)+'%';
      el('c-btc-chg').style.color=btc.change_rate>=0?'var(--green)':'var(--red)';
    }

    list.innerHTML='';
    Object.entries(data).forEach(([pair, p], i)=>{
      const name=p.name||pair.replace('KRW-','');
      const cls=p.change_rate>=0?'pos':'neg';
      const sign=p.change_rate>=0?'+':'';
      const badge=p.source==='live'?'<span class="mi-badge live">LIVE</span>':'<span class="mi-badge mock">MOCK</span>';
      list.innerHTML+=`<div class="mi">
        <div class="mi-rank">${i+1}</div>
        <div><div class="mi-name">${name}${badge}</div><div class="mi-code">${pair}</div></div>
        <div class="mi-price">${p.price>=10000?Math.round(p.price).toLocaleString():p.price.toLocaleString()}</div>
        <div class="mi-chg ${cls}">${sign}${(p.change_rate||0).toFixed(2)}%</div>
      </div>`;
    });
  } catch(e) { console.warn('market', e); }
}

// 코인 포지션
async function fetchPositions() {
  try {
    const { data } = await fetchWithFallback('/api/positions/crypto','/api/mock/positions/crypto');
    const cards=document.getElementById('c-cards');
    if (!data||!data.length) {
      cards.innerHTML='<div class="empty-msg">보유 코인 없음</div>';
      document.getElementById('c-pos-cnt').textContent='0';
      document.getElementById('c-eval').textContent='-';
      return;
    }
    document.getElementById('c-pos-cnt').textContent=data.length;
    let totalEval=0;
    cards.innerHTML='';
    data.forEach(p=>{
      const cls=pc(p.pnl_rate||0);
      const borderColor=p.pnl_rate>=0?'var(--crypto)':'rgba(248,113,113,0.6)';
      const qty=typeof p.qty==='number'?p.qty.toFixed(4):p.qty;
      totalEval+=(p.cur_price||0)*(p.qty||0);
      cards.innerHTML+=`
        <div class="coin-card" style="border-left-color:${borderColor}">
          <div class="cc-header">
            <div><div class="cc-sym">${p.name||p.pair}</div><div class="cc-ex">${p.pair} · 업비트</div></div>
            <div class="cc-pct ${cls}">${p.pnl_rate>=0?'+':''}${(p.pnl_rate||0).toFixed(1)}%</div>
          </div>
          <div class="cc-grid">
            <div><div class="cc-sl">보유량</div><div class="cc-sv bright">${qty} ${p.currency}</div></div>
            <div><div class="cc-sl">평균단가</div><div class="cc-sv">${(p.avg_price||0).toLocaleString()}</div></div>
            <div><div class="cc-sl">현재가</div><div class="cc-sv bright">${(p.cur_price||0).toLocaleString()}</div></div>
            <div><div class="cc-sl">평가손익</div><div class="cc-sv ${cls}">${fmt(p.pnl)}원</div></div>
          </div>
        </div>`;
    });
    document.getElementById('c-eval').textContent=Math.round(totalEval).toLocaleString();
  } catch(e) { console.warn('crypto pos', e); }
}

// 매매 이력
async function fetchHistory() {
  try {
    let data;
    try {
      const r = await fetch('/api/trades?bot=crypto_trader&limit=10');
      const j = await r.json();
      data = j.success ? j.data : [];
    } catch { data = []; }
    const list=document.getElementById('hist-list');
    if (!data||!data.length) { list.innerHTML='<div class="empty-msg">매매 이력 없음</div>'; return; }
    list.innerHTML='';
    data.forEach(t=>{
      const time=new Date(t.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const pnl=t.pnl!=null?(t.pnl>=0?'+':'')+Math.round(t.pnl).toLocaleString()+'원':'보유중';
      const pnlCls=t.pnl!=null?(t.pnl>=0?'pos':'neg'):'pend';
      const qty=typeof t.quantity==='number'&&t.quantity<1?t.quantity.toFixed(4):t.quantity;
      list.innerHTML+=`<div class="hist-item">
        <span class="h-time">${time}</span>
        <span class="h-tag ${t.side==='BUY'?'tag-buy':'tag-sell'}">${t.side==='BUY'?'매수':'매도'}</span>
        <span class="h-name">${t.symbol}</span>
        <span class="h-price">${(t.price||0).toLocaleString()}×${qty}</span>
        <span class="h-res ${pnlCls}">${pnl}</span>
      </div>`;
    });
  } catch(e){}
}

// 전략
async function fetchStrategies() {
  try {
    const { data } = await fetchWithFallback('/api/strategies?bot=crypto_trader','/api/strategies?bot=crypto_trader');
    const list=document.getElementById('strat-list');
    if (!data||!data.length) { list.innerHTML='<div class="empty-msg">전략 없음</div>'; return; }
    list.innerHTML='';
    data.forEach(s=>{
      const params=s.params||{};
      const paramStr=Object.entries(params).slice(0,3).map(([k,v])=>`<span class="sp">${k} <span>${v}</span></span>`).join('');
      list.innerHTML+=`
        <div class="strat-item ${s.is_active?'active-c':''}">
          <div class="sh"><span class="sn">${s.name}</span><span class="spill ${s.is_active?'on':'off'}">${s.is_active?'ON':'OFF'}</span></div>
          <div class="sparams">${paramStr}</div>
          ${s.is_active?`<div class="ssig"><div class="sig-dot" style="background:var(--green)"></div><span style="color:var(--green);font-size:10px;">활성 — 신호 감지 중</span></div>`:''}
        </div>`;
    });
  } catch(e){}
}

async function loadAll() {
  await Promise.all([fetchStatus(), fetchSummary(), fetchMarket(), fetchPositions(), fetchHistory(), fetchStrategies()]);
}

loadAll();
setInterval(fetchStatus, 10000);
setInterval(fetchMarket, 5000);    // 시세 5초 갱신
setInterval(() => { fetchSummary(); fetchPositions(); fetchHistory(); }, 30000);
</script>

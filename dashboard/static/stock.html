<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AutoTrader — 주식</title>
<style>
:root[data-theme="dark"] {
  --bg:#0d1421;--panel:#1a2332;--card:#1e2d40;--border:#2a3a4e;
  --text:#e8edf3;--muted:#8b95a1;--up:#f75467;--dn:#4386f9;
  --accent:#1763b6;--header:#111827;--input:#243447;--badge:#243447;
}
:root[data-theme="light"] {
  --bg:#f4f6f9;--panel:#ffffff;--card:#ffffff;--border:#e2e8f0;
  --text:#1a2332;--muted:#8b95a1;--up:#e02020;--dn:#1763b6;
  --accent:#1763b6;--header:#ffffff;--input:#f4f6f9;--badge:#f0f4ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Pretendard',sans-serif;font-size:14px;}
body{display:flex;flex-direction:column;}

.header{background:var(--header);border-bottom:1px solid var(--border);
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;}

/* 시장 요약 */
.market-bar{background:var(--panel);padding:10px 16px;
  border-bottom:1px solid var(--border);display:flex;gap:20px;overflow-x:auto;}
.mkt-item{display:flex;flex-direction:column;gap:2px;white-space:nowrap;}
.mkt-label{font-size:11px;color:var(--muted);}
.mkt-val{font-size:14px;font-weight:700;}

/* 계좌 요약 */
.account-bar{background:var(--panel);padding:12px 16px;
  border-bottom:1px solid var(--border);}
.account-top{display:flex;justify-content:space-between;margin-bottom:8px;}
.account-label{font-size:11px;color:var(--muted);}
.account-val{font-size:22px;font-weight:800;font-family:'SF Mono',monospace;}
.account-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.account-sub-item{display:flex;flex-direction:column;gap:2px;}
.account-sub-label{font-size:10px;color:var(--muted);}
.account-sub-val{font-size:13px;font-weight:700;}

/* 봇 상태 */
.bot-status{background:var(--panel);padding:8px 16px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;}
.bot-name{font-size:12px;font-weight:600;}
.bot-desc{font-size:11px;color:var(--muted);}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;
  display:inline-block;margin-right:4px;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* 탭 */
.tab-row{background:var(--panel);display:flex;
  border-bottom:2px solid var(--border);overflow-x:auto;white-space:nowrap;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;
  margin-bottom:-2px;white-space:nowrap;flex-shrink:0;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}

/* 포지션 */
.section{padding:12px;}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kpi-card{background:var(--card);border-radius:10px;padding:14px;border:1px solid var(--border);}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.kpi-val{font-size:18px;font-weight:800;font-family:'SF Mono',monospace;}
.pos-card{background:var(--card);border-radius:10px;padding:14px;
  border:1px solid var(--border);margin-bottom:10px;}
.pos-header-row{display:flex;justify-content:space-between;margin-bottom:10px;align-items:center;}
.pos-stock-name{font-size:15px;font-weight:700;}
.pos-code{font-size:11px;color:var(--muted);}
.pos-rate{font-size:16px;font-weight:800;}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pos-gi{display:flex;flex-direction:column;gap:2px;}
.pos-gi-label{font-size:10px;color:var(--muted);}
.pos-gi-val{font-size:13px;font-weight:600;}

/* 감시 종목 리스트 */
.watch-col-header{display:grid;grid-template-columns:1fr 80px 60px 70px;
  padding:8px 16px;font-size:11px;color:var(--muted);
  border-bottom:1px solid var(--border);background:var(--panel);}
.watch-row{display:grid;grid-template-columns:1fr 80px 60px 70px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  align-items:center;background:var(--panel);}
.watch-name{font-size:13px;font-weight:600;}
.watch-code{font-size:10px;color:var(--muted);}
.watch-price{text-align:right;font-size:13px;font-weight:700;font-family:'SF Mono',monospace;}
.watch-rate{text-align:right;font-size:12px;font-weight:700;}
.watch-signal{text-align:right;}
.sig-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;}
.sig-buy{background:rgba(247,84,103,0.15);color:var(--up);}
.sig-sell{background:rgba(67,134,249,0.15);color:var(--dn);}
.sig-hold{background:var(--badge);color:var(--muted);}

/* Jarvis 신호 */
.signal-card{background:var(--card);border-radius:10px;padding:14px;
  border:1px solid var(--border);margin-bottom:10px;}
.sig-header{display:flex;justify-content:space-between;margin-bottom:8px;}
.sig-stock{font-size:14px;font-weight:700;}
.sig-strategy{font-size:11px;color:var(--muted);}
.sig-body{display:flex;justify-content:space-between;align-items:center;}
.sig-reason{font-size:12px;color:var(--muted);flex:1;margin-right:12px;}
.big-badge{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:800;}

/* 수급/공시 */
.supply-card{background:var(--card);border-radius:10px;padding:14px;
  border:1px solid var(--border);margin-bottom:10px;}
.supply-name{font-size:14px;font-weight:700;margin-bottom:8px;}
.supply-row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;}
.supply-label{color:var(--muted);}

/* 거래이력 */
.trade-item{background:var(--card);border-radius:10px;padding:14px;
  border:1px solid var(--border);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;}
.trade-left{display:flex;flex-direction:column;gap:3px;}
.trade-stock{font-size:14px;font-weight:700;}
.trade-time{font-size:11px;color:var(--muted);}
.trade-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.trade-amount{font-size:14px;font-weight:700;}
.trade-side{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
.side-buy{background:rgba(247,84,103,0.15);color:var(--up);}
.side-sell{background:rgba(67,134,249,0.15);color:var(--dn);}

.up{color:var(--up);}
.dn{color:var(--dn);}
.hidden{display:none!important;}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px;}

/* 하단 네비 */
.bottom-nav{background:var(--header);border-top:1px solid var(--border);
  display:flex;height:56px;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;
  color:var(--muted);font-size:10px;font-weight:500;}
.bn-item.active{color:var(--accent);}
.bn-icon{font-size:22px;line-height:1;}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div style="width:44px"></div>
  <div class="header-title">주식</div>
  <div>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
  </div>
</div>

<!-- 시장 요약 (코스피/코스닥) -->
<div class="market-bar">
  <div class="mkt-item">
    <span class="mkt-label">코스피</span>
    <span class="mkt-val"><b id="kospi-val">-</b> <span id="kospi-chg" style="font-size:12px">-</span></span>
  </div>
  <div class="mkt-item">
    <span class="mkt-label">코스닥</span>
    <span class="mkt-val"><b id="kosdaq-val">-</b> <span id="kosdaq-chg" style="font-size:12px">-</span></span>
  </div>
  <div class="mkt-item" style="margin-left:auto;text-align:right">
    <span class="mkt-label">업데이트</span>
    <span class="mkt-val" id="market-time" style="font-size:12px">-</span>
  </div>
</div>

<!-- 계좌 요약 -->
<div class="account-bar">
  <div class="account-top">
    <div>
      <div class="account-label">총 평가금액</div>
      <div class="account-val" id="total-eval">-</div>
    </div>
    <div style="text-align:right">
      <div class="account-label">평가손익</div>
      <div class="account-val" id="total-pnl" style="font-size:18px">-</div>
    </div>
  </div>
  <div class="account-sub">
    <div class="account-sub-item">
      <span class="account-sub-label">주식평가</span>
      <span class="account-sub-val" id="stock-eval">-</span>
    </div>
    <div class="account-sub-item">
      <span class="account-sub-label">예수금</span>
      <span class="account-sub-val" id="deposit">-</span>
    </div>
    <div class="account-sub-item">
      <span class="account-sub-label">수익률</span>
      <span class="account-sub-val" id="pnl-rate">-</span>
    </div>
  </div>
</div>

<!-- 봇 상태 -->
<div class="bot-status">
  <div>
    <span class="live-dot"></span>
    <span class="bot-name">stock-trader</span>
    <span class="bot-desc" id="bot-desc"> · KIS API · 운영중</span>
  </div>
  <div id="last-update" style="font-size:11px;color:var(--muted)">-</div>
</div>

<!-- 탭 -->
<div class="tab-row">
  <button class="tab-btn active" onclick="showTab('position',this)">보유자산</button>
  <button class="tab-btn" onclick="showTab('watchlist',this)">감시 종목</button>
  <button class="tab-btn" onclick="showTab('signal',this)">Jarvis 신호</button>
  <button class="tab-btn" onclick="showTab('supply',this)">수급/공시</button>
  <button class="tab-btn" onclick="showTab('trades',this)">거래내역</button>
</div>

<!-- 보유자산 탭 -->
<div id="tab-position">
  <div class="section">
    <div id="pos-list"><div class="empty">보유 종목 없음</div></div>
  </div>
</div>

<!-- 감시 종목 탭 -->
<div id="tab-watchlist" class="hidden">
  <div class="watch-col-header">
    <span>종목</span>
    <span style="text-align:right">현재가</span>
    <span style="text-align:right">등락률</span>
    <span style="text-align:right">ML신호</span>
  </div>
  <div id="watch-list"></div>
</div>

<!-- Jarvis 신호 탭 -->
<div id="tab-signal" class="hidden">
  <div class="section" id="signal-list">
    <div class="empty">신호 없음</div>
  </div>
</div>

<!-- 수급/공시 탭 -->
<div id="tab-supply" class="hidden">
  <div class="section">
    <div id="supply-list"><div class="empty">수급 데이터 없음<br><small style="color:var(--muted)">16:00 이후 수집됩니다</small></div></div>
  </div>
</div>

<!-- 거래내역 탭 -->
<div id="tab-trades" class="hidden">
  <div class="section" id="trade-list">
    <div class="empty">거래 내역 없음</div>
  </div>
</div>

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a href="dashboard-C.html" class="bn-item"><span class="bn-icon">⊞</span>대시보드</a>
  <a href="stock.html" class="bn-item active"><span class="bn-icon">📈</span>주식</a>
  <a href="crypto.html" class="bn-item"><span class="bn-icon">₿</span>코인</a>
  <a href="strategy.html" class="bn-item"><span class="bn-icon">⚙</span>전략</a>
  <a href="jarvis.html" class="bn-item"><span class="bn-icon">🤖</span>Jarvis</a>
</nav>

<script>
const API = '';
function fmt(n){return Number(n||0).toLocaleString();}
function fmtR(r){return (r>=0?'+':'')+parseFloat(r||0).toFixed(2)+'%';}

// 테마
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-icon').textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'light':'dark');
}
const t=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',t);
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('theme-icon').textContent=t==='dark'?'🌙':'☀️';
});

function showTab(tab,btn){
  ['position','watchlist','signal','supply','trades'].forEach(t=>{
    document.getElementById('tab-'+t).classList.add('hidden');
  });
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.remove('hidden');
  if(btn)btn.classList.add('active');
}

// 시계
function updateClock(){
  const now=new Date();
  document.getElementById('last-update').textContent='업데이트: '+now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

async function fetchPositions(){
  try{
    const r=await fetch(`${API}/api/positions/stock`);
    const d=await r.json();
    const acct=d.account||{};
    const te=acct.total_eval||0;
    const se=acct.stock_eval||0;
    const cash=acct.cash||0;
    const pnl=acct.pnl||0;
    const pr=acct.pnl_rate||0;

    document.getElementById('total-eval').textContent=fmt(te)+'원';
    const tpEl=document.getElementById('total-pnl');
    tpEl.textContent=(pnl>=0?'+':'')+fmt(Math.round(pnl))+'원';
    tpEl.className='account-val '+(pnl>=0?'up':'dn');
    document.getElementById('stock-eval').textContent=fmt(se)+'원';
    document.getElementById('deposit').textContent=fmt(cash)+'원';
    const prEl=document.getElementById('pnl-rate');
    prEl.textContent=fmtR(pr);
    prEl.className='account-sub-val '+(pr>=0?'up':'dn');

    const positions=d.data||[];
    const list=document.getElementById('pos-list');
    if(!positions.length){list.innerHTML='<div class="empty">보유 종목 없음</div>';return;}
    list.innerHTML=positions.map(p=>{
      const rate=parseFloat(p.pnl_rate||0);
      const cls=rate>=0?'up':'dn';
      return `<div class="pos-card">
        <div class="pos-header-row">
          <div>
            <div class="pos-stock-name">${p.name||p.symbol}</div>
            <div class="pos-code">${p.symbol}</div>
          </div>
          <div class="pos-rate ${cls}">${fmtR(rate)}</div>
        </div>
        <div class="pos-grid">
          <div class="pos-gi"><span class="pos-gi-label">보유수량</span><span class="pos-gi-val">${fmt(p.qty||0)}주</span></div>
          <div class="pos-gi"><span class="pos-gi-label">평균단가</span><span class="pos-gi-val">${fmt(p.avg_price)}</span></div>
          <div class="pos-gi"><span class="pos-gi-label">현재가</span><span class="pos-gi-val ${cls}">${fmt(p.cur_price)}</span></div>
          <div class="pos-gi"><span class="pos-gi-label">평가손익</span><span class="pos-gi-val ${cls}">${rate>=0?'+':''}${fmt(Math.round(p.pnl||0))}원</span></div>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function fetchWatchlist(){
  try{
    let mlMap={}, newsMap={};
    try{const mr=await fetch(`${API}/api/ml/predictions`);const md=await mr.json();(md.data||[]).forEach(p=>mlMap[p.symbol]=p);}catch(e){}
    try{const nr=await fetch(`${API}/api/data/sentiment`);const nd=await nr.json();(nd.data||[]).forEach(n=>newsMap[n.symbol]=n);}catch(e){}

    const r=await fetch(`${API}/api/prices/stock`);
    const d=await r.json();
    const list=document.getElementById('watch-list');
    const entries=Object.values(d.data||{});
    if(!entries.length){list.innerHTML='<div class="empty">감시 종목 없음</div>';return;}
    list.innerHTML=entries.map(p=>{
      const rate=parseFloat(p.change_rate||0);
      const cls=rate>=0?'up':'dn';
      const ml=mlMap[p.symbol];
      const mlBadge=ml?`<span class="sig-badge ${ml.signal==='BUY'?'sig-buy':ml.signal==='SELL'?'sig-sell':'sig-hold'}">${ml.signal}</span>`:'<span class="sig-badge sig-hold">-</span>';
      return `<div class="watch-row">
        <div><div class="watch-name">${p.name||p.symbol}</div><div class="watch-code">${p.symbol}</div></div>
        <div class="watch-price ${cls}">${fmt(p.price)}</div>
        <div class="watch-rate ${cls}">${fmtR(rate)}</div>
        <div class="watch-signal">${mlBadge}</div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function fetchML(){
  try{
    const r=await fetch(`${API}/api/ml/predictions`);
    const d=await r.json();
    const list=document.getElementById('signal-list');
    const data=d.data||[];
    if(!data.length){list.innerHTML='<div class="empty">신호 없음</div>';return;}
    list.innerHTML=data.map(p=>{
      const cls=p.signal==='BUY'?'up':p.signal==='SELL'?'dn':'';
      const bcls=p.signal==='BUY'?'sig-buy':p.signal==='SELL'?'sig-sell':'sig-hold';
      return `<div class="signal-card">
        <div class="sig-header">
          <div><div class="sig-stock">${p.name||p.symbol}</div><div class="sig-strategy">${p.symbol} · ML ${((p.buy_prob||0)*100).toFixed(0)}%</div></div>
          <span class="big-badge ${bcls}">${p.signal}</span>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function fetchTrades(){
  try{
    const r=await fetch(`${API}/api/trades?bot=stock_trader&limit=30`);
    const d=await r.json();
    const list=document.getElementById('trade-list');
    const data=d.data||[];
    if(!data.length){list.innerHTML='<div class="empty">거래 내역 없음</div>';return;}
    list.innerHTML=data.map(t=>{
      const isBuy=t.side==='BUY';
      const time=new Date(t.ts||t.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      const pnl=parseFloat(t.pnl||0);
      return `<div class="trade-item">
        <div class="trade-left">
          <div class="trade-stock">${t.name||t.symbol} <span class="trade-side ${isBuy?'side-buy':'side-sell'}">${t.side}</span></div>
          <div class="trade-time">${time} · ${t.strategy||''}</div>
        </div>
        <div class="trade-right">
          <div class="trade-amount">${fmt(Math.round(t.amount||0))}원</div>
          ${pnl?`<div class="${pnl>=0?'up':'dn'}" style="font-size:12px">${pnl>=0?'+':''}${fmt(Math.round(pnl))}원</div>`:''}
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function fetchMarketIndex(){
  try{
    const r=await fetch(`${API}/api/market/index`);
    const d=await r.json();
    if(d.success&&d.data){
      const ki=d.data.KOSPI;const kd=d.data.KOSDAQ;
      if(ki){
        document.getElementById('kospi-val').textContent=ki.price.toLocaleString();
        const kc=document.getElementById('kospi-chg');
        kc.textContent=(ki.change_rate>=0?'+':'')+ki.change_rate.toFixed(2)+'%';
        kc.className=ki.change_rate>=0?'up':'dn';
      }
      if(kd){
        document.getElementById('kosdaq-val').textContent=kd.price.toLocaleString();
        const kdc=document.getElementById('kosdaq-chg');
        kdc.textContent=(kd.change_rate>=0?'+':'')+kd.change_rate.toFixed(2)+'%';
        kdc.className=kd.change_rate>=0?'up':'dn';
      }
      document.getElementById('market-time').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    }
  }catch(e){}
}

async function loadAll(){
  await Promise.all([fetchPositions(),fetchWatchlist(),fetchML(),fetchTrades(),fetchMarketIndex()]);
}
loadAll();
setInterval(loadAll,30000);
setInterval(fetchMarketIndex,60000);
</script>
</body>
</html>

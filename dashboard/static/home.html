<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AutoTrader</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoTrader">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="theme-color" content="#0B0F17">

<style>
  :root {
    --bg: #0B0F17;
    --surface: #1E293B;
    --surface-2: #0F172A;
    --border: #334155;
    --text: #e6edf3;
    --text-dim: #94A3B8;
    --up: #EF4444;      /* 수익 = 빨강 (한국 관습) */
    --down: #3B82F6;    /* 손실 = 파랑 */
    --accent: #F59E0B;  /* 골드/앰버 — STARK 확신도 */
    --success: #10B981; /* 체결완료/온라인 상태 */
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Pretendard', BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.4;
    padding-bottom: 40px;
  }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ── 헤더 탭 ── */
  .tabs {padding-top:env(safe-area-inset-top);
    display: flex; position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 16px 0;
    font-size: 16px; font-weight: 700; color: var(--text-dim);
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .bell { position:relative; padding:14px 16px 0 4px; font-size:19px; cursor:pointer; }
  .badge { position:absolute; top:8px; right:6px; background:var(--up); color:#fff;
           font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:8px;
           display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .noti-panel { position:fixed; top:52px; left:8px; right:8px; z-index:100; max-height:60vh;
    overflow-y:auto; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .noti-head { display:flex; justify-content:space-between; padding:12px 14px;
    font-weight:700; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  .noti-clear { color:var(--accent); font-size:12px; cursor:pointer; }
  .noti-item { padding:11px 14px; border-bottom:1px solid var(--border); }
  .noti-item:last-child { border-bottom:none; }
  .noti-item.unread { background:rgba(245,158,11,.06); }
  .noti-title { font-size:13px; font-weight:700; }
  .noti-body { font-size:12px; color:var(--text-dim); margin-top:3px; white-space:pre-wrap;
    max-height:60px; overflow:hidden; }
  .noti-time { font-size:10px; color:var(--text-dim); margin-top:4px; }
.act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.act-btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.act-btn.ok{background:#10B981;color:#000;}.act-btn.no{background:#3a2a2a;color:#EF4444;border:1px solid #5a3a3a;}
.act-btn:disabled{opacity:.5;}
.act-done{font-size:11px;color:#94A3B8;}


  /* ── 요약 카드 ── */
  .summary {
    padding: 20px 16px 8px;
  }
  .hero-eval {
    font-size: 13px; color: var(--text-dim); margin-bottom: 4px;
  }
  .hero-amount {
    font-size: 34px; font-weight: 800; letter-spacing: -1px;
  }
  .hero-pnl {
    font-size: 16px; font-weight: 700; margin-top: 4px;
  }
  .cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 12px 16px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .card .value { font-size: 20px; font-weight: 700; }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--text-dim); }

  /* ── 섹션 ── */
  .section { padding: 8px 16px; }
  .section-title {
    font-size: 13px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .5px;
    margin: 16px 0 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-dim); font-weight: 600;
  }

  /* ── 보유 종목 ── */
  .pos {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pos-left .name { font-size: 15px; font-weight: 700; }
  .pos-left .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .pos-right { text-align: right; }
  .pos-right .amt { font-size: 15px; font-weight: 700; }
  .pos-right .rate { font-size: 13px; font-weight: 700; margin-top: 3px; }

  /* ── 거래내역 ── */
  .trade {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .trade:last-child { border-bottom: none; }
  .trade-left { display: flex; align-items: center; gap: 10px; }
  .side-tag {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    min-width: 40px; text-align: center;
  }
  .side-buy { background: rgba(239,68,68,.15); color: var(--up); }
  .side-sell { background: rgba(59,130,246,.15); color: var(--down); }
  .trade-name { font-size: 14px; font-weight: 600; }
  .trade-time { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .trade-right { text-align: right; }
  .trade-amt { font-size: 14px; font-weight: 600; }
  .trade-pnl { font-size: 12px; font-weight: 700; margin-top: 2px; }

  .empty { text-align: center; color: var(--text-dim); padding: 30px 0; font-size: 14px; }
  .loading { text-align: center; color: var(--text-dim); padding: 20px 0; }

  /* ── 상태 표시 ── */
  .status-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 0 16px; font-size: 12px; color: var(--text-dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .dot.off { background: var(--text-dim); }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
  }
  .nav a {
    flex: 1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding: 9px 0 7px; font-size: 11px; font-weight:600;
    color: var(--text-dim); text-decoration: none;
  }
  .nav-ic { font-size: 21px; line-height:1; }
  .nav a.active { color: var(--accent); }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" style="cursor:default;">📈 포트폴리오 요약</div>
    <div class="bell" onclick="toggleNoti()">🔔<span class="badge" id="notiBadge" style="display:none">0</span></div>
</div>

<div class="noti-panel" id="notiPanel" style="display:none">
  <div class="noti-head">알림 <span class="noti-clear" onclick="toggleNoti()">닫기</span></div>
  <div id="notiList"><div class="empty">알림이 없습니다</div></div>
</div>

<div class="status-bar" style="padding-top:10px;">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">연결 중...</span>
</div>

<!-- 요약 -->
<div class="summary">
  <div class="hero-eval" id="heroLabel">총 평가금액</div>
  <div class="hero-amount mono" id="heroAmount">—</div>
  <div class="hero-pnl mono" id="heroPnl">—</div>
</div>

<div class="cards">
  <div class="card">
    <div class="label" id="cardLabel1">예수금</div>
    <div class="value mono" id="cardCash">—</div>
  </div>
  <div class="card">
    <div class="label">매입금액</div>
    <div class="value mono" id="cardBuy">—</div>
  </div>
</div>

<!-- 보유 종목 -->
<div class="section">
  <div class="section-title">
    보유 종목 <span class="badge" id="posCount">0</span>
  </div>
  <div id="positions"><div class="loading">불러오는 중...</div></div>
</div>

<!-- 감시 종목 (주식 탭) -->
<div class="section" id="watchSection" style="display:none;">
  <div class="section-title">감시 종목 <span class="badge" id="watchCount">0</span></div>
  <div id="watchList"><div class="empty">불러오는 중...</div></div>
</div>

<!-- 거래 내역 -->
<div class="section">
  <div class="section-title">거래 내역</div>
  <div id="trades"><div class="loading">불러오는 중...</div></div>
</div>

<div class="nav">
  <a href="/" class="active"><span class="nav-ic">⊞</span>홈</a>
  <a href="/stock"><span class="nav-ic">📈</span>포트폴리오</a>
  <a href="/stark"><span class="nav-ic">🧠</span>STARK 브레인</a>
  <a href="/strategy"><span class="nav-ic">⚙️</span>전략/설정</a>
  <a href="/training"><span class="nav-ic">🎓</span>트레이닝</a>
  <a href="/logs"><span class="nav-ic">📋</span>시스템 로그</a>
</div>

<script>
const API = "";

function won(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Math.round(n).toLocaleString("ko-KR") + "원";
}
function pct(n) {
  if (n === null || n === undefined || isNaN(n)) return "";
  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}
function cls(n) { return n > 0 ? "up" : n < 0 ? "down" : "flat"; }

async function loadAll() {
  loadSummary();
  loadTrades();
}

async function loadSummary() {
  const posEl = document.getElementById("positions");
  try {
    const res = await fetch(`${API}/api/positions/stock`);
    const json = await res.json();

    // 상태
    const dot = document.getElementById("statusDot");
    const st  = document.getElementById("statusText");
    if (json.success && json.stale) {
      dot.classList.add("off");
      const at = json.snapshot_at ? new Date(json.snapshot_at) : null;
      const atStr = at ? `${at.getMonth()+1}/${at.getDate()} ${String(at.getHours()).padStart(2,"0")}:${String(at.getMinutes()).padStart(2,"0")}` : "";
      st.textContent = `KIS 점검 중 — 마지막 확인(${atStr}) 데이터 표시`;
    } else if (json.success) {
      dot.classList.remove("off");
      st.textContent = "주식 봇 연결됨";
    } else {
      dot.classList.add("off");
      st.textContent = "연결 실패: " + (json.error || "알 수 없음");
    }

    const acct = json.account || {};
    const total = acct.total_eval ?? acct.total ?? 0;
    const pnl   = acct.pnl ?? 0;
    const pnlRate = acct.pnl_rate ?? 0;
    const cash  = acct.cash ?? 0;
    const buy   = acct.buy_amount ?? 0;

    document.getElementById("heroAmount").textContent = won(total);
    const heroPnl = document.getElementById("heroPnl");
    heroPnl.textContent = (pnl >= 0 ? "▲ " : "▼ ") + won(Math.abs(pnl)) + "  " + pct(pnlRate);
    heroPnl.className = "hero-pnl mono " + cls(pnl);

    document.getElementById("cardCash").textContent = won(cash);
    document.getElementById("cardBuy").textContent = won(buy);

    // 보유 종목
    const positions = json.data || [];
    document.getElementById("posCount").textContent = positions.length;
    if (positions.length === 0) {
      posEl.innerHTML = '<div class="empty">보유 종목이 없습니다</div>';
    } else {
      posEl.innerHTML = positions.map(p => {
        const name = p.name || (p.symbol || "").replace("KRW-", "");
        const rate = p.pnl_rate ?? 0;
        const pnlv = p.pnl ?? 0;
        const cur  = p.cur_price ?? 0;
        const avg  = p.avg_price ?? 0;
        const isStock = !(p.symbol || "").includes("KRW-");
        const spark = isStock
          ? `<canvas class="spark" data-sym="${p.symbol}" width="600" height="60"
               style="width:100%;height:30px;margin-top:6px;display:block;"></canvas>` : "";
        return `
          <div class="pos" style="display:block;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="pos-left">
                <div class="name">${name}</div>
                <div class="sub mono">${p.qty}주 · 평단 ${won(avg)}${(p.sellable_qty !== undefined && p.sellable_qty < p.qty) ? ` <span style="color:#F59E0B;">⏳정산중 ${p.qty - p.sellable_qty}주</span>` : ''}</div>
              </div>
              <div class="pos-right">
                <div class="amt mono">${won(cur)}</div>
                <div class="rate mono ${cls(pnlv)}">${won(pnlv)} ${pct(rate)}</div>
              </div>
            </div>
            ${spark}
          </div>`;
      }).join("");
      drawSparks();
    }
  } catch (e) {
    document.getElementById("statusDot").classList.add("off");
    document.getElementById("statusText").textContent = "네트워크 오류";
    posEl.innerHTML = '<div class="empty">불러오기 실패</div>';
  }
}

async function loadTrades() {
  const el = document.getElementById("trades");
  const bot = "stock_trader";
  try {
    const res = await fetch(`${API}/api/trades?bot=${bot}&limit=30`);
    const json = await res.json();
    const trades = json.data || [];
    if (trades.length === 0) {
      el.innerHTML = '<div class="empty">거래 내역이 없습니다</div>';
      return;
    }
    el.innerHTML = trades.map(t => {
      const name = (t.name || t.symbol || "").replace("KRW-", "");
      const isBuy = t.side === "BUY";
      const t2 = t.ts ? new Date(t.ts) : null;
      const timeStr = t2 ? `${t2.getMonth()+1}/${t2.getDate()} ${String(t2.getHours()).padStart(2,"0")}:${String(t2.getMinutes()).padStart(2,"0")}` : "";
      const pnlHtml = (t.pnl !== null && t.pnl !== undefined)
        ? `<div class="trade-pnl mono ${cls(t.pnl)}">${won(t.pnl)}</div>` : "";
      return `
        <div class="trade">
          <div class="trade-left">
            <span class="side-tag ${isBuy ? "side-buy" : "side-sell"}">${isBuy ? "매수" : "매도"}</span>
            <div>
              <div class="trade-name">${name}</div>
              <div class="trade-time mono">${timeStr} · ${t.strategy || ""}</div>
            </div>
          </div>
          <div class="trade-right">
            <div class="trade-amt mono">${won(t.amount)}</div>
            <div class="trade-detail mono" style="font-size:11px;color:var(--text-dim,#8b949e);">${won(t.price)} × ${t.quantity}주</div>
            ${pnlHtml}
          </div>
        </div>`;
    }).join("");
  } catch (e) {
    el.innerHTML = '<div class="empty">불러오기 실패</div>';
  }
}

loadAll();
setInterval(loadSummary, 10000);  // 10초마다 갱신
setInterval(loadTrades, 15000);   // 15초마다 갱신


// ── 승인 버튼 공용 ──
function renderActions(actions, sid){
  if(!actions||!actions.length) return '';
  return '<div class="act-row">'+actions.map(a=>a.alive
    ? `<button class="act-btn ${a.data.includes(':ok:')?'ok':'no'}" onclick="doAction('${a.data}',this,'${sid||''}')">${a.label}</button>`
    : `<span class="act-done">${a.label.replace(/[✅❌]\s*/,'')} · 처리/만료</span>`).join('')+'</div>';
}
async function doAction(data, btn, sid){
  if(!confirm((data.includes(':ok:')?'승인':'거절')+' 하시겠어요?')) return;
  const row = btn.closest('.act-row'); if(row) row.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    const r=await fetch('/api/jarvis/action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data, session_id: sid||'web'})});
    const j=await r.json();
    if(row) row.innerHTML='<span class="act-done">'+(j.reply||'처리됨').replace(/</g,'&lt;').slice(0,160)+'</span>';
  }catch(e){ if(row) row.innerHTML='<span class="act-done">❌ 처리 실패</span>'; }
}
function renderBtnMarkers(text, sid){
  // [[BTN:data|label]] 마커 → 버튼
  const acts=[]; const clean=text.replace(/\[\[BTN:([^|\]]+)\|([^\]]+)\]\]/g,(m,d,l)=>{acts.push({data:d,label:l,alive:true});return '';});
  return {text:clean.trim(), html:renderActions(acts, sid)};
}

// ── 알림센터 + 배지 ──
async function pollNoti(){
  try{
    const r = await fetch('/api/notifications?limit=30');
    const j = await r.json();
    const b = document.getElementById('notiBadge');
    if(j.unread > 0){ b.textContent = j.unread > 99 ? '99+' : j.unread; b.style.display='flex'; }
    else b.style.display='none';
    // PWA 앱 아이콘 배지 (지원 기기)
    try{ if(navigator.setAppBadge){ j.unread>0 ? navigator.setAppBadge(j.unread) : navigator.clearAppBadge(); } }catch(e){}
    window._notiData = j.data || [];
  }catch(e){}
}
function renderNoti(){
  const el = document.getElementById('notiList');
  const d = window._notiData || [];
  if(!d.length){ el.innerHTML = '<div class="empty">알림이 없습니다</div>'; return; }
  el.innerHTML = d.map(n=>{
    const t = new Date(n.created_at);
    const ts = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    return `<div class="noti-item ${n.is_read?'':'unread'}">
      <div class="noti-title">${n.title||''}</div>
      <div class="noti-body">${(n.body||'').replace(/</g,'&lt;')}</div>
      ${renderActions(n.actions,'web')}
      <div class="noti-time">${ts}</div></div>`;
  }).join('');
}
async function toggleNoti(){
  const p = document.getElementById('notiPanel');
  const opening = p.style.display === 'none';
  p.style.display = opening ? 'block' : 'none';
  if(opening){
    renderNoti();
    try{ await fetch('/api/notifications/read', {method:'POST'}); }catch(e){}
    setTimeout(pollNoti, 500);
  }
}
pollNoti();
setInterval(pollNoti, 15000);

// ── 감시 종목 위젯 ──
async function loadWatchlist(){
  const sec = document.getElementById('watchSection');
  sec.style.display = '';
  try{
    const r = await fetch('/api/prices/stock');
    const j = await r.json();
    const items = Object.values(j.data || j.prices || {});
    document.getElementById('watchCount').textContent = items.length;
    const el = document.getElementById('watchList');
    if(!items.length){ el.innerHTML = '<div class="empty">감시 종목 없음</div>'; return; }
    el.innerHTML = items.map(p=>{
      const chg = Number(p.change_rate ?? p.change ?? 0);
      const c = chg > 0 ? 'up' : chg < 0 ? 'down' : '';
      return `<div class="pos" style="padding:10px 0;">
        <div class="pos-left">
          <div class="name" style="font-size:13px;">${p.name || p.symbol}</div>
          <div class="sub mono">${p.symbol}</div>
        </div>
        <div class="pos-right">
          <div class="amt mono" style="font-size:13px;">${won(Number(p.price||0))}</div>
          <div class="rate mono ${c}">${pct(chg)}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}
loadWatchlist();
setInterval(loadWatchlist, 15000);

// ── 보유종목 30일 미니차트 ──
const _sparkCache = {};
async function drawSparks(){
  document.querySelectorAll('canvas.spark').forEach(async cv=>{
    const sym = cv.dataset.sym;
    try{
      if(!_sparkCache[sym]){
        const r = await fetch(`/api/chart/${sym}?days=30`);
        const j = await r.json();
        _sparkCache[sym] = (j.data||[]).map(x=>x.c);
      }
      const cs = _sparkCache[sym];
      if(!cs || cs.length < 2) return;
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height, pad = 4;
      ctx.clearRect(0,0,W,H);
      const mn = Math.min(...cs), mx = Math.max(...cs);
      const up = cs[cs.length-1] >= cs[0];
      ctx.strokeStyle = up ? '#EF4444' : '#3B82F6';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      cs.forEach((c,i)=>{
        const x = pad + i*(W-pad*2)/(cs.length-1);
        const y = H-pad - (c-mn)/(mx-mn||1)*(H-pad*2);
        i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      });
      ctx.stroke();
    }catch(e){}
  });
}
</script>

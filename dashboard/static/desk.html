<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTrader — 트레이딩 데스크</title>
<style>
:root{--bg:#0a0e14;--panel:#131920;--panel2:#1a222c;--border:#232d3a;
      --text:#c9d4e0;--bright:#e6edf3;--dim:#7d8896;
      --up:#f6465d;--down:#2f8fff;--gold:#f0b90b;--green:#16c784;--purple:#a78bfa;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
     font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.mono{font-variant-numeric:tabular-nums;}
.up{color:var(--up);} .down{color:var(--down);}

/* 헤더 */
header{display:flex;align-items:center;gap:28px;padding:12px 20px;
       background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-size:16px;font-weight:800;color:var(--bright);}
.logo span{color:var(--gold);}
.h-item{display:flex;flex-direction:column;gap:2px;}
.h-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.h-val{font-size:15px;font-weight:700;color:var(--bright);}
.bots{margin-left:auto;display:flex;gap:14px;}
.bot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);}
.dot{width:7px;height:7px;border-radius:50%;background:#555;}
.dot.on{background:var(--green);}
.h-link{color:var(--dim);font-size:11px;text-decoration:none;border:1px solid var(--border);
        padding:5px 10px;border-radius:7px;}

/* 3컬럼 */
.grid{flex:1;display:grid;grid-template-columns:280px 1fr 380px;gap:1px;
      background:var(--border);overflow:hidden;}
.col{background:var(--bg);overflow-y:auto;padding:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
      padding:14px;margin-bottom:12px;}
.ct{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;}
.empty{color:var(--dim);text-align:center;padding:16px 0;font-size:12px;}

/* 좌: 감시종목/작전 */
.w-row{display:flex;justify-content:space-between;padding:7px 0;
       border-bottom:1px solid var(--border);font-size:12px;}
.w-row:last-child{border:none;}
.plan{font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--text);}

/* 중앙: 보유 + 일지 */
.pos-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
          padding:16px;margin-bottom:12px;}
.pos-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.pos-name{font-size:16px;font-weight:800;color:var(--bright);}
.pos-sub{font-size:11px;color:var(--dim);margin-left:8px;}
.pos-pnl{font-size:15px;font-weight:800;}
canvas.spark{width:100%;height:56px;display:block;margin-top:8px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{color:var(--dim);font-weight:600;text-align:left;padding:6px 8px;
   border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;}
td{padding:7px 8px;border-bottom:1px solid var(--border);}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
.tag.e{background:rgba(246,70,93,.15);color:var(--up);}
.tag.s{background:rgba(125,136,150,.2);color:var(--dim);}
.tag.m{background:rgba(240,185,11,.15);color:var(--gold);}

/* 우: 자비스 */
.jarvis-col{display:flex;flex-direction:column;padding:0;}
.j-head{padding:13px 16px;border-bottom:1px solid var(--border);background:var(--panel);
        font-weight:800;color:var(--bright);flex-shrink:0;}
.j-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.j-b{max-width:88%;padding:10px 13px;border-radius:11px;font-size:12.5px;
     line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.j-b.user{align-self:flex-end;background:rgba(59,130,246,.28);
          border:1px solid rgba(59,130,246,.5);color:#fff;}
.j-b.bot{align-self:flex-start;background:var(--panel2);
         border:1px solid var(--border);border-left:3px solid var(--purple);color:var(--bright);}
.j-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);
         background:var(--panel);flex-shrink:0;}
.j-input textarea{flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;color:var(--bright);padding:10px 12px;font-size:13px;resize:none;
  font-family:inherit;height:42px;}
.j-input button{background:var(--purple);border:none;border-radius:9px;color:#fff;
  padding:0 18px;font-weight:700;cursor:pointer;}
.typing{color:var(--dim);font-size:12px;padding:4px 13px;}

@media (max-width:1100px){
  body::before{content:"이 페이지는 PC 전용입니다. 모바일은 홈(/)을 이용하세요.";
    display:block;padding:14px;text-align:center;background:var(--gold);color:#000;font-weight:700;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header>
  <div class="logo">Auto<span>Trader</span> DESK</div>
  <div class="h-item"><div class="h-label">총 평가금액</div><div class="h-val mono" id="hTotal">-</div></div>
  <div class="h-item"><div class="h-label">평가손익</div><div class="h-val mono" id="hPnl">-</div></div>
  <div class="h-item"><div class="h-label">예수금 D+2</div><div class="h-val mono" id="hCash">-</div></div>
  <div class="h-item"><div class="h-label">코스피</div><div class="h-val mono" id="hKospi">-</div></div>
  <div class="h-item"><div class="h-label">코스닥</div><div class="h-val mono" id="hKosdaq">-</div></div>
  <div class="bots">
    <div class="bot"><div class="dot" id="d-stk"></div>주식봇</div>
    <div class="bot"><div class="dot" id="d-cry"></div>코인봇</div>
    <div class="bot"><div class="dot" id="d-dat"></div>수집기</div>
    <a class="h-link" href="/">모바일 홈</a>
  </div>
</header>

<div class="grid">
  <!-- 좌 -->
  <div class="col">
    <div class="card">
      <div class="ct">감시 종목 <span id="wCount"></span></div>
      <div id="watchL"><div class="empty">로딩...</div></div>
    </div>
    <div class="card">
      <div class="ct">오늘의 작전</div>
      <div class="plan" id="planTxt">로딩...</div>
    </div>
  </div>

  <!-- 중앙 -->
  <div class="col">
    <div class="ct" style="margin:2px 2px 10px;">보유 포지션</div>
    <div id="posL"><div class="empty">로딩...</div></div>
    <div class="card" style="margin-top:4px;">
      <div class="ct">오늘 판단 일지</div>
      <table>
        <thead><tr><th>시각</th><th>종목</th><th>판정</th><th>전략</th><th>금액</th><th>채점</th></tr></thead>
        <tbody id="jrnl"><tr><td colspan="6" class="empty">로딩...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 우: 자비스 -->
  <div class="col jarvis-col">
    <div class="j-head">🤖 Jarvis — 총괄 관리자</div>
    <div class="j-msgs" id="jm">
      <div class="j-b bot">안녕하세요, 주인님. 데스크에서 바로 지시하실 수 있습니다.
지시 저장 · 설정 변경 · '차트 종목명' · '종목 N주 매수' 모두 가능합니다.</div>
    </div>
    <div class="typing" id="jt" style="display:none;">자비스 생각 중...</div>
    <div class="j-input">
      <textarea id="ji" placeholder="자비스에게 지시/질문... (Enter 전송)"></textarea>
      <button onclick="send()">전송</button>
    </div>
  </div>
</div>

<script>
const won=n=>Number(n||0).toLocaleString()+"원";
const pct=n=>(n>=0?"+":"")+Number(n||0).toFixed(2)+"%";
const cls=n=>n>0?"up":n<0?"down":"";

async function loadHeader(){
  try{
    const r=await fetch('/api/account/stock'); const j=await r.json();
    const a=j.data||j;
    if(a){ hTotal.textContent=won(a.total_eval??a.total??0);
      const p=a.pnl??0;
      hPnl.textContent=won(p); hPnl.className='h-val mono '+cls(p);
      hCash.textContent=won(a.cash??0); }
  }catch(e){}
  try{
    const r=await fetch('/api/market/index'); const j=await r.json();
    const d=j.data||{};
    if(d.KOSPI){hKospi.textContent=d.KOSPI.price.toLocaleString();
      hKospi.className='h-val mono '+cls(d.KOSPI.change_rate);}
    if(d.KOSDAQ){hKosdaq.textContent=d.KOSDAQ.price.toLocaleString();
      hKosdaq.className='h-val mono '+cls(d.KOSDAQ.change_rate);}
  }catch(e){}
  try{
    const r=await fetch('/api/status'); const j=await r.json();
    const s=j.data||j;
    const on=(b)=>{try{return (typeof b==='string'?JSON.parse(b):b).status==='running';}catch(e){return false;}};
    document.getElementById('d-stk').className='dot '+(on(s.stock_trader)?'on':'');
    document.getElementById('d-cry').className='dot '+(on(s.crypto_trader)?'on':'');
    document.getElementById('d-dat').className='dot '+(on(s.data_collector)?'on':'');
  }catch(e){}
}

async function loadWatch(){
  try{
    const r=await fetch('/api/prices/stock'); const j=await r.json();
    const items=Object.values(j.data||j.prices||{});
    wCount.textContent=items.length+'종목';
    watchL.innerHTML=items.length?items.map(p=>{
      const c=Number(p.change_rate??p.change??0);
      return `<div class="w-row"><div><b style="color:var(--bright)">${p.name||p.symbol}</b>
        <span style="color:var(--dim);font-size:10px;"> ${p.symbol}</span></div>
        <div class="mono" style="text-align:right;">${won(p.price)}<br>
        <span class="${cls(c)}">${pct(c)}</span></div></div>`;
    }).join(''):'<div class="empty">감시 종목 없음</div>';
  }catch(e){}
}

async function loadPlan(){
  try{
    const r=await fetch('/api/jarvis/plan'); const j=await r.json();
    planTxt.textContent=(j.plan||j.data||'작전 없음 (08:30 수립)').slice(0,900);
  }catch(e){planTxt.textContent='작전 없음';}
}

const _sc={};
async function loadPos(){
  try{
    const r=await fetch('/api/positions/stock'); const j=await r.json();
    const ps=j.data||[];
    posL.innerHTML=ps.length?ps.map(p=>{
      const rate=p.pnl_rate??0,pnl=p.pnl??0;
      return `<div class="pos-card">
        <div class="pos-head">
          <div><span class="pos-name">${p.name||p.symbol}</span>
            <span class="pos-sub">${p.qty}주 · 평단 ${won(p.avg_price)}</span></div>
          <div class="pos-pnl ${cls(pnl)}">${won(pnl)} (${pct(rate)})</div>
        </div>
        <div class="mono" style="color:var(--dim);font-size:12px;">현재가 ${won(p.cur_price)}</div>
        <canvas class="spark" data-sym="${p.symbol}" width="900" height="110"></canvas>
      </div>`;
    }).join(''):'<div class="empty">보유 포지션 없음</div>';
    drawSparks();
  }catch(e){}
}
async function drawSparks(){
  document.querySelectorAll('canvas.spark').forEach(async cv=>{
    const sym=cv.dataset.sym;
    try{
      if(!_sc[sym]){const r=await fetch(`/api/chart/${sym}?days=30`);
        const j=await r.json();_sc[sym]=(j.data||[]).map(x=>x.c);}
      const cs=_sc[sym]; if(!cs||cs.length<2)return;
      const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,pad=6;
      ctx.clearRect(0,0,W,H);
      const mn=Math.min(...cs),mx=Math.max(...cs),up=cs[cs.length-1]>=cs[0];
      ctx.strokeStyle=up?'#f6465d':'#2f8fff';ctx.lineWidth=3;ctx.beginPath();
      cs.forEach((c,i)=>{const x=pad+i*(W-pad*2)/(cs.length-1);
        const y=H-pad-(c-mn)/(mx-mn||1)*(H-pad*2);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
    }catch(e){}
  });
}

async function loadJournal(){
  try{
    const r=await fetch('/api/journal?days=1'); const j=await r.json();
    const d=j.data||[];
    jrnl.innerHTML=d.length?d.slice(0,25).map(x=>{
      const t=new Date(x.ts);
      const tag=x.source==='chat'?'<span class="tag m">수동</span>'
        :x.jarvis_decision==='SKIP'?'<span class="tag s">SKIP</span>'
        :`<span class="tag e">${x.jarvis_decision==='EXECUTE_SMALL'?'소액':'매수'}</span>`;
      const ev=(x.eval_pnl_rate!=null)?`<span class="${cls(x.eval_pnl_rate)}">${pct(x.eval_pnl_rate)}</span>`:'-';
      return `<tr><td class="mono">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</td>
        <td><b>${x.name||x.symbol}</b></td><td>${tag}</td>
        <td style="color:var(--dim)">${x.strategy||''}</td>
        <td class="mono">${x.price&&x.qty?won(x.price*x.qty):'-'}</td><td>${ev}</td></tr>`;
    }).join(''):'<tr><td colspan="6" class="empty">오늘 판단 없음</td></tr>';
  }catch(e){}
}

// 자비스 채팅
const jm=document.getElementById('jm'),ji=document.getElementById('ji'),jt=document.getElementById('jt');
function addB(role,txt){const d=document.createElement('div');
  d.className='j-b '+role;d.textContent=txt;jm.appendChild(d);jm.scrollTop=jm.scrollHeight;}
async function send(){
  const t=ji.value.trim(); if(!t)return;
  ji.value=''; addB('user',t); jt.style.display='block';
  try{
    const r=await fetch('/api/jarvis/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:t,session_id:'desk'})});
    const j=await r.json();
    addB('bot', j.reply||('❌ '+(j.error||'오류')));
  }catch(e){addB('bot','❌ 연결 오류');}
  jt.style.display='none';
}
ji.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

function loadAll(){loadHeader();loadWatch();loadPos();loadJournal();}
loadAll(); loadPlan();
setInterval(loadAll, 15000);
setInterval(loadPlan, 120000);
</script>
</body>
</html>

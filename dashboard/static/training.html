<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자비스 트레이닝</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoTrader">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="theme-color" content="#0a0e14">

<style>
  :root{--bg:#0a0e14;--surface:#131920;--border:#232d3a;--text:#e6edf3;--dim:#7d8896;
        --up:#f6465d;--down:#2f8fff;--gold:#f0b90b;--green:#16c784;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;padding-bottom:60px;}
  .mono{font-variant-numeric:tabular-nums;}
  header{padding-top:env(safe-area-inset-top);padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-size:18px;} .sub{font-size:12px;color:var(--dim);margin-top:2px;}
  .section{padding:8px 16px;}
  .stitle{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;
          letter-spacing:.5px;margin:14px 0 8px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;
        padding:12px 10px;text-align:center;}
  .card .v{font-size:20px;font-weight:800;}
  .card .l{font-size:11px;color:var(--dim);margin-top:3px;}
  .day{background:var(--surface);border:1px solid var(--border);border-radius:10px;
       padding:12px;margin-bottom:8px;}
  .day-head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px;}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--border);}
  .bar div{height:100%;}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:6px;flex-wrap:wrap;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
  .lesson{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);
          border-radius:8px;padding:12px;margin-bottom:8px;font-size:13px;line-height:1.5;}
  .lesson .t{font-size:11px;color:var(--dim);margin-top:6px;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
       border-bottom:1px solid var(--border);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .tag.exec{background:rgba(246,70,93,.15);color:var(--up);}
  .tag.skip{background:rgba(125,136,150,.2);color:var(--dim);}
  .tag.manual{background:rgba(240,185,11,.15);color:var(--gold);}
  .rate.pos{color:var(--up);} .rate.neg{color:var(--down);}
  .empty{text-align:center;color:var(--dim);padding:28px 0;}
  .nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
       border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:11px;font-weight:600;color:var(--dim);text-decoration:none;}
  .nav-ic{font-size:21px;line-height:1;}
  .nav a.active{color:var(--gold);}

.kn-core{background:rgba(240,185,11,.08);border:1px solid rgba(240,185,11,.3);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:12.5px;}
.kn-core .cat{color:var(--gold, #f0b90b);font-weight:700;margin-right:6px;}
.kn-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.kn-item:last-child{border:none;}
.kn-del{background:none;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>
<header>
  <div><h1>🎓 자비스 트레이닝</h1><div class="sub">판단 채점 · 학습 교훈 · 성장 기록</div></div>
</header>

<div class="section">
  <div class="stitle">최근 14일 성적</div>
  <div class="cards">
    <div class="card"><div class="v" id="s-hit">-</div><div class="l">매수 적중</div></div>
    <div class="card"><div class="v" id="s-miss">-</div><div class="l">매수 빗나감</div></div>
    <div class="card"><div class="v" id="s-good">-</div><div class="l">SKIP 잘거름</div></div>
    <div class="card"><div class="v" id="s-missed">-</div><div class="l">기회 놓침</div></div>
  </div>
</div>

<div class="section">
  <div class="stitle">일별 채점</div>
  <div id="daily"><div class="empty">채점 데이터가 아직 없어요 (오늘 15:40 첫 채점)</div></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--up)"></span>매수적중</span>
    <span><span class="dot" style="background:#8b2635"></span>빗나감</span>
    <span><span class="dot" style="background:var(--green)"></span>잘거름</span>
    <span><span class="dot" style="background:#b8860b"></span>기회놓침</span>
  </div>
</div>

<div class="section">
  <div class="section-title">📚 학습 라이브러리 <span class="badge" id="knCount">0</span></div>
  <div id="knCore"></div>
  <div style="font-size:11px;color:var(--dim);margin:10px 0 6px;">전체 학습 원칙 (최근순)</div>
  <div id="knList"><div class="empty">아직 학습한 자료가 없어요 — 자비스에게 URL과 함께 '이거 배워'</div></div>
</div>

<div class="section">
  <div class="stitle">누적 교훈 (자비스가 배운 것)</div>
  <div id="lessons"><div class="empty">아직 교훈이 없어요</div></div>
</div>

<div class="section">
  <div class="stitle">최근 판단 기록</div>
  <div id="journal"><div class="empty">불러오는 중...</div></div>
</div>

<div class="nav">
  <a href="/"><span class="nav-ic">⊞</span>홈</a>
  <a href="/strategy"><span class="nav-ic">⚙️</span>전략</a>
  <a href="/jarvis.html"><span class="nav-ic">🤖</span>자비스</a>
  <a href="/training" class="active"><span class="nav-ic">🎓</span>트레이닝</a>
  <a href="/logs"><span class="nav-ic">📋</span>로그</a>
</div>

<script>
const pct = n => (n>=0?"+":"")+n.toFixed(1)+"%";

async function load(){
  try{
    const r = await fetch("/api/training/summary");
    const j = await r.json();
    if(j.success){
      // 합계 카드
      let hit=0,miss=0,good=0,missed=0;
      (j.daily||[]).forEach(d=>{hit+=d.exec_hit;miss+=d.exec_miss;good+=d.skip_good;missed+=d.skip_missed;});
      s_set("s-hit",hit); s_set("s-miss",miss); s_set("s-good",good); s_set("s-missed",missed);
      // 일별 바
      const dEl=document.getElementById("daily");
      if(j.daily && j.daily.length){
        dEl.innerHTML=j.daily.map(d=>{
          const t=d.exec_hit+d.exec_miss+d.skip_good+d.skip_missed||1;
          const seg=(n,c)=>n?`<div style="width:${n/t*100}%;background:${c}"></div>`:"";
          return `<div class="day"><div class="day-head"><span>${d.date}</span><span class="mono">${d.total}건</span></div>
            <div class="bar">${seg(d.exec_hit,'var(--up)')}${seg(d.exec_miss,'#8b2635')}${seg(d.skip_good,'var(--green)')}${seg(d.skip_missed,'#b8860b')}</div></div>`;
        }).join("");
      }
      // 교훈
      const lEl=document.getElementById("lessons");
      if(j.lessons && j.lessons.length){
        lEl.innerHTML=j.lessons.map(l=>{
          const t=new Date(l.ts);
          return `<div class="lesson">${l.content}<div class="t">${t.getMonth()+1}/${t.getDate()}</div></div>`;
        }).join("");
      }
    }
  }catch(e){}
  try{
    const r=await fetch("/api/journal?days=7");
    const j=await r.json();
    const el=document.getElementById("journal");
    if(j.success && j.data && j.data.length){
      el.innerHTML=j.data.slice(0,30).map(x=>{
        const t=new Date(x.ts);
        const tag=x.source==='chat'?'<span class="tag manual">수동</span>'
                 :x.jarvis_decision==='EXECUTE'?'<span class="tag exec">매수</span>'
                 :'<span class="tag skip">SKIP</span>';
        const ev=(x.eval_pnl_rate!==null&&x.eval_pnl_rate!==undefined)
          ?`<span class="rate mono ${x.eval_pnl_rate>=0?'pos':'neg'}">${pct(Number(x.eval_pnl_rate))}</span>`:"";
        return `<div class="row"><div>${tag} <b>${x.name||x.symbol}</b>
          <span style="color:var(--dim);font-size:11px"> ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} · ${x.strategy||""}</span></div>${ev}</div>`;
      }).join("");
    } else {
      el.innerHTML='<div class="empty">판단 기록이 아직 없어요 (오늘 장부터 쌓입니다)</div>';
    }
  }catch(e){}
}
function s_set(id,v){document.getElementById(id).textContent=v;}
load();
setInterval(load, 30000);
</script>

<style id="unified-nav">
.bottom-nav, .nav {
  display:flex !important; position:fixed !important; bottom:0 !important;
  left:0 !important; right:0 !important; z-index:50 !important;
  background:#131920 !important; border-top:1px solid #232d3a !important;
  padding:0 0 env(safe-area-inset-bottom) 0 !important; margin:0 !important;
  height:calc(56px + env(safe-area-inset-bottom)) !important;
}
.bottom-nav a, .nav a, .bn-item {
  flex:1 !important; display:flex !important; flex-direction:column !important;
  align-items:center !important; justify-content:center !important;
  gap:2px !important; padding:0 !important; margin:0 !important;
  font-size:11px !important; font-weight:600 !important;
  color:#7d8896 !important; text-decoration:none !important; line-height:1.2 !important;
}
.bottom-nav a.active, .nav a.active, .bn-item.active { color:#f0b90b !important; }
.bn-icon, .nav-ic { font-size:20px !important; line-height:1 !important; }
body { padding-bottom:calc(64px + env(safe-area-inset-bottom)) !important; }
</style>

<script>
// ── 학습 라이브러리 ──
async function loadKnowledge(){
  try{
    const r=await fetch('/api/jarvis/knowledge');const j=await r.json();
    const core=j.core||[], data=j.data||[];
    document.getElementById('knCount').textContent=data.length;
    document.getElementById('knCore').innerHTML=core.length
      ? '<div style="font-size:11px;color:var(--dim);margin-bottom:6px;">핵심 원칙 (정제본 '+core.length+')</div>'
        + core.map(c=>{const m=c.content.match(/^\[(.+?)\]\s*(.*)$/);
          const ap=c.applied||0, hi=c.hits||0;
          const perf=ap>0?`<span style="float:right;color:${hi/ap>=0.6?'#16c784':'var(--dim)'};font-size:11px;">${hi}/${ap} (${Math.round(hi/ap*100)}%)</span>`
                         :`<span style="float:right;color:var(--dim);font-size:10px;">데이터 수집 중</span>`;
          return `<div class="kn-core"><span style="color:var(--dim);font-size:10px;">K${c.id}</span> ${m?'<span class="cat">'+m[1]+'</span>'+m[2]:c.content}${perf}</div>`;}).join('')
      : '<div style="font-size:11px;color:var(--dim);">정제본 없음 — 토요일 자동 정리 또는 자료 3개 이상 시 생성</div>';
    const el=document.getElementById('knList');
    if(data.length){
      el.innerHTML=data.map(k=>`<div class="kn-item"><span>${k.content.replace(/</g,'&lt;')}</span>
        <button class="kn-del" onclick="delKn(${k.id})">삭제</button></div>`).join('');
    }
  }catch(e){}
}
async function delKn(id){
  if(!confirm('이 원칙을 제외할까요?'))return;
  await fetch('/api/jarvis/knowledge/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadKnowledge();
}
loadKnowledge();
</script>
</body>
</html>

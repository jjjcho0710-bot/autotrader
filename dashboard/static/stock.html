<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTrader — 주식</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#12131a;--panel:#1a1c27;--panel2:#1f2133;--border:#272a3d;--stock:#5b8fff;--crypto:#f0a500;--green:#34d399;--red:#f87171;--purple:#a78bfa;--muted:#4b5270;--text:#8892b0;--bright:#e2e8f7;--grotesk:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
*::-webkit-scrollbar{display:none;}
body{background:var(--bg);color:var(--text);font-family:var(--grotesk);font-size:13px;height:100vh;display:flex;overflow:hidden;}
.sidebar{width:120px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;height:100vh;}
.sidebar-logo{width:100%;height:52px;display:flex;align-items:center;justify-content:flex-start;padding:0 12px;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--stock),var(--crypto));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:700;font-family:var(--mono);}
.logo-text{font-size:13px;font-weight:700;color:var(--bright);font-family:var(--mono);}
.sidebar-nav{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:10px 6px;gap:2px;width:100%;}
.nav-item{width:100%;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;padding:0 10px;gap:8px;cursor:pointer;color:var(--muted);font-size:16px;transition:background 0.15s,color 0.15s;position:relative;}
.nav-item span{font-size:11px;font-weight:500;color:inherit;}
.nav-divider{width:80%;height:1px;background:var(--border);margin:4px 6px;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--panel2);color:var(--bright);}
.nav-item.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;}
.nav-item.s.active::before{background:var(--stock);}
.nav-item.d.active::before{background:var(--green);}
.nav-item.c.active::before{background:var(--crypto);}
.nav-item.t.active::before{background:var(--purple);}
.nav-item.l.active::before{background:var(--text);}
.nav-item.j.active::before{background:var(--purple);}
.sidebar-bottom{padding-bottom:12px;display:flex;flex-direction:column;align-items:center;width:100%;}
.sdot-group{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);width:100%;}
.sdot-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.sdot.on{background:var(--green);box-shadow:0 0 5px var(--green);}
.sdot-label{font-size:7px;color:var(--muted);font-family:var(--mono);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;flex-shrink:0;}
.page-label{font-size:14px;font-weight:600;color:var(--bright);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green);font-family:var(--mono);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.clock{font-family:var(--mono);font-size:11px;color:var(--muted);}
.page{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.page-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ph-left{display:flex;align-items:center;gap:12px;}
.ph-dot{width:10px;height:10px;border-radius:50%;background:var(--stock);box-shadow:0 0 10px var(--stock);}
.ph-title{font-size:15px;font-weight:700;color:var(--bright);}
.ph-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ph-pnl{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--green);}
.ph-psub{font-size:10px;color:var(--muted);margin-top:2px;text-align:right;}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border);flex-shrink:0;}
.kpi{padding:12px 18px;border-right:1px solid var(--border);}
.kpi:last-child{border-right:none;}
.kpi-label{font-size:9px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px;}
.kpi-value{font-size:17px;font-weight:700;font-family:var(--mono);line-height:1;}
.kpi-value.pos{color:var(--green);}.kpi-value.neg{color:var(--red);}.kpi-value.stock{color:var(--stock);}.kpi-value.bright{color:var(--bright);}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
.content-grid{flex:1;display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr 1fr;overflow:hidden;}
.pbox{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;flex-direction:column;overflow:hidden;}
.pbox.nr{border-right:none;}.pbox.nb{border-bottom:none;}
.ptitle{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.paction{font-size:10px;color:var(--stock);cursor:pointer;letter-spacing:0;text-transform:none;}
.pos-table{width:100%;border-collapse:collapse;font-size:12px;}
.pos-table th{text-align:left;font-size:9px;color:var(--muted);padding:0 0 8px;border-bottom:1px solid var(--border);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
.pos-table th:not(:first-child){text-align:right;}
.pos-table td{padding:9px 0;border-bottom:1px solid rgba(39,42,61,0.7);vertical-align:middle;}
.pos-table tr:last-child td{border-bottom:none;}
.tk-name{font-size:13px;font-weight:600;color:var(--bright);}
.tk-code{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px;}
.nr2{text-align:right;font-family:var(--mono);font-size:12px;}
.nr2.pos{color:var(--green);}.nr2.neg{color:var(--red);}.nr2.neu{color:var(--text);}
.pct-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.pct-bar{height:3px;border-radius:2px;width:36px;background:var(--border);overflow:hidden;}
.pct-fill{height:100%;border-radius:2px;}
.hist-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto;scrollbar-width:none;}
.hist-item{display:grid;grid-template-columns:52px 40px 1fr auto auto;gap:6px;align-items:center;padding:7px 10px;background:var(--panel2);border-radius:6px;border:1px solid var(--border);font-size:11px;}
.h-time{font-family:var(--mono);color:var(--muted);font-size:10px;}
.h-tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;text-align:center;}
.tag-buy{background:rgba(52,211,153,0.12);color:var(--green);}
.tag-sell{background:rgba(248,113,113,0.12);color:var(--red);}
.h-name{color:var(--bright);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.h-price{font-family:var(--mono);color:var(--text);text-align:right;font-size:10px;}
.h-res{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;}
.h-res.pos{color:var(--green);}.h-res.neg{color:var(--red);}.h-res.pend{color:var(--muted);font-size:10px;}
.strat-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;scrollbar-width:none;}
.strat-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;flex-shrink:0;}
.strat-item.active-s{border-color:rgba(91,143,255,0.4);background:rgba(91,143,255,0.05);}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.sn{font-size:12px;font-weight:600;color:var(--bright);}
.spill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;}
.spill.on{background:rgba(52,211,153,0.12);color:var(--green);}
.spill.off{background:rgba(75,82,112,0.3);color:var(--muted);}
.sparams{display:flex;gap:8px;flex-wrap:wrap;}
.sp{font-size:10px;color:var(--muted);font-family:var(--mono);}
.sp span{color:var(--stock);}
.ssig{margin-top:5px;font-size:10px;display:flex;align-items:center;gap:5px;}
.sig-dot{width:5px;height:5px;border-radius:50%;}
/* 관심종목 */
.watch-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;}
.wi{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);flex-shrink:0;transition:background 0.1s;}
.wi:hover{background:#252840;}
.wi-left{display:flex;align-items:center;gap:8px;}
.wi-rank{font-family:var(--mono);font-size:10px;color:var(--muted);width:14px;}
.wi-name{font-size:12px;font-weight:600;color:var(--bright);}
.wi-code{font-size:10px;color:var(--muted);font-family:var(--mono);}
.wi-right{display:flex;gap:12px;align-items:center;}
.wi-price{font-family:var(--mono);font-size:12px;color:var(--bright);}
.wi-chg{font-family:var(--mono);font-size:11px;font-weight:700;min-width:52px;text-align:right;}
.wi-chg.pos{color:var(--green);}.wi-chg.neg{color:var(--red);}
.empty-msg{color:var(--muted);font-size:11px;padding:10px 0;}
@media(max-width:768px){.sidebar{width:100%!important;height:56px!important;flex-direction:row!important;position:fixed!important;bottom:0!important;top:auto!important;z-index:100!important;border-right:none!important;border-top:1px solid var(--border)!important;padding:0 8px!important;}.sidebar-logo{display:none!important;}.sidebar-nav{flex-direction:row!important;padding:0!important;gap:0!important;justify-content:space-around!important;width:100%!important;flex:1!important;}.nav-item{flex-direction:column!important;height:56px!important;justify-content:center!important;padding:0!important;font-size:20px!important;gap:2px!important;flex:1!important;}.nav-item span{font-size:10px!important;}.nav-divider{display:none!important;}.sidebar-bottom{display:none!important;}.main{padding-bottom:56px!important;}body{height:100dvh!important;}}</style>
  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><div class="logo-mark">AT</div><span class="logo-text">AutoTrader</span></div>
  <div class="sidebar-nav">
    <div class="nav-item j" onclick="location.href='jarvis.html'">🤖<span>Jarvis</span></div>
    <div class="nav-divider"></div>
    <div class="nav-item d" onclick="location.href='dashboard-C.html'">⊞<span>대시보드</span></div>
    <div class="nav-item s active" onclick="location.href='stock.html'">📈<span>주식</span></div>
    <div class="nav-item c" onclick="location.href='crypto.html'">₿<span>코인</span></div>
    <div class="nav-item t" onclick="location.href='strategy.html'">⚙<span>전략</span></div>
    <div class="nav-item l" onclick="location.href='/analysis.html'">🧠 <span>분석</span></div>
    <div class="nav-item l" onclick="location.href='logs.html'">≡<span>로그</span></div>
  </div>
  <div class="sidebar-bottom">
    <div class="sdot-group">
      <div class="sdot-wrap"><div class="sdot" id="dot-stk"></div><div class="sdot-label">STK</div></div>
      <div class="sdot-wrap"><div class="sdot" id="dot-cry"></div><div class="sdot-label">CRY</div></div>
      <div class="sdot-wrap"><div class="sdot" id="dot-dat"></div><div class="sdot-label">DAT</div></div>
    </div>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <div class="page-label">주식</div>
    <div class="topbar-right">
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
      <div class="clock" id="clock">-</div>
    </div>
  </div>
  <div class="page">
    <div class="page-header">
      <div class="ph-left">
        <div class="ph-dot"></div>
        <div>
          <div class="ph-title">stock-trader</div>
          <div class="ph-sub" id="market-status">한국투자증권 KIS API · 확인 중...</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div class="ph-pnl" id="sh-today-pnl">+0원</div>
        <div class="ph-psub">오늘 수익 / 누적 <span id="sh-total-pnl">+0</span>원</div>
      </div>
    </div>
    <div class="kpi-strip">
      <div class="kpi"><div class="kpi-label">총 평가금액</div><div class="kpi-value stock" id="s-total-eval">-</div><div class="kpi-sub">원</div></div>
      <div class="kpi"><div class="kpi-label">주식 평가금액</div><div class="kpi-value bright" id="s-eval">-</div><div class="kpi-sub">원</div></div>
      <div class="kpi"><div class="kpi-label">예수금 (주문가능)</div><div class="kpi-value bright" id="s-cash">-</div><div class="kpi-sub">원</div></div>
      <div class="kpi"><div class="kpi-label">평가손익</div><div class="kpi-value pos" id="s-pnl">-</div><div class="kpi-sub" id="s-pnl-rate">-</div></div>
      <div class="kpi"><div class="kpi-label">보유 종목</div><div class="kpi-value bright" id="s-pos-cnt">0</div><div class="kpi-sub" id="s-trades-sub">오늘 0건</div></div>
    </div>
    <div class="content-grid">
      <div class="pbox">
        <div class="ptitle">보유 포지션<span class="paction">실시간</span></div>
        <table class="pos-table">
          <thead><tr>
            <th>종목</th><th style="text-align:right">수량</th><th style="text-align:right">평균단가</th>
            <th style="text-align:right">현재가</th><th style="text-align:right">평가손익</th><th style="text-align:right">수익률</th>
          </tr></thead>
          <tbody id="pos-tbody"><tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">로딩 중...</td></tr></tbody>
        </table>
      </div>
      <div class="pbox nr">
        <div class="ptitle">전략 상태<span class="paction" onclick="location.href='strategy.html'">전략 관리 →</span></div>
        <div class="strat-list" id="strat-list"><div class="empty-msg">로딩 중...</div></div>
      </div>
      <div class="pbox nb">
        <div class="ptitle">오늘 매매 이력</div>
        <div class="hist-list" id="hist-list"><div class="empty-msg">로딩 중...</div></div>
      </div>
      <div class="pbox nr nb">
        <div class="ptitle" style="display:flex;align-items:center;justify-content:space-between;">
          관심 종목 <span style="color:var(--muted);font-weight:400;">(실시간 시세)</span>
          <button onclick="toggleSymbolManager()" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;">⚙️ 종목 관리</button>
        </div>
        <div class="watch-list" id="watch-list"><div class="empty-msg">로딩 중...</div></div>
        
        <!-- 종목 관리 패널 -->
        <div id="symbol-manager" style="display:none;margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--panel2);">
          <div style="font-size:12px;font-weight:600;color:var(--bright);margin-bottom:10px;">📋 감시 종목 관리</div>
          <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input id="new-symbol" placeholder="종목코드 (예: 005930)" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;">
            <input id="new-symbol-name" placeholder="종목명 (예: 삼성전자)" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:12px;">
            <button onclick="addSymbol()" style="background:var(--stock);color:white;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;">추가</button>
          </div>
          <div id="symbol-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>
      </div>
    </div>

<script>
const API = '';

// fallback fetch
async function fetchWithFallback(realPath, mockPath) {
  try {
    const res = await fetch(`${API}${realPath}`);
    const json = await res.json();
    const d = json.data;
    const hasData = d && (Array.isArray(d) ? d.length > 0 : Object.keys(d).length > 0);
    if (json.success && hasData) return json;
    throw new Error('empty or no data');
  } catch {
    try {
      const res = await fetch(`${API}${mockPath}`);
      return res.json();
    } catch(e2) { return { success: false, data: null }; }
  }
}

// 시계
function updateClock() {
  const now = new Date();
  const d = now.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'.').replace('.','');
  const t = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').textContent = `${d} ${t}`;
}
setInterval(updateClock, 1000); updateClock();

// 장 상태
function updateMarketStatus() {
  const now = new Date(), h = now.getHours(), m = now.getMinutes();
  const min = h*60+m, open=9*60, close=15*60+30;
  const el = document.getElementById('market-status');
  if (min>=open && min<=close) {
    const rem=close-min;
    el.textContent=`KIS API · 운영중 · 마감까지 ${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
    el.style.color='var(--green)';
  } else {
    el.textContent='KIS API · 장 마감 (09:00~15:30)';
    el.style.color='var(--muted)';
  }
}
setInterval(updateMarketStatus, 60000); updateMarketStatus();

const fmt = (n, p=true) => { if(n==null)return'-'; const s=n>=0?(p?'+':''):'-'; return s+Math.abs(Math.round(n)).toLocaleString(); };
const pc = n => n>=0?'pos':'neg';

// 봇 상태
async function fetchStatus() {
  try {
    const { data } = await fetchWithFallback('/api/status','/api/mock/status');
    if (!data) return;
    ['dot-stk','dot-cry','dot-dat'].forEach((id,i)=>{
      const bot=['stock_trader','crypto_trader','data_collector'][i];
      const el=document.getElementById(id);
      if(!el)return;
      const on=data[bot]?.status==='running';
      el.style.background=on?'var(--green)':'var(--red)';
      el.style.boxShadow=on?'0 0 5px var(--green)':'none';
    });
  } catch(e){}
}

// 요약
async function fetchSummary() {
  try {
    const { data } = await fetchWithFallback('/api/summary','/api/mock/summary');
    if (!data) return;
    const sp=Math.round(data.bot_pnl?.stock_trader||0);
    const tp=Math.round(data.total_pnl||0);
    document.getElementById('sh-today-pnl').textContent=(sp>=0?'+':'')+sp.toLocaleString()+'원';
    document.getElementById('sh-today-pnl').style.color=sp>=0?'var(--green)':'var(--red)';
    document.getElementById('sh-total-pnl').textContent=fmt(tp,false);
    document.getElementById('s-pnl').textContent=fmt(sp);
    document.getElementById('s-pnl').className='kpi-value '+(sp>=0?'pos':'neg');
    document.getElementById('s-trades').textContent=data.today_trades||0;
  } catch(e){}
}

// 보유 포지션
async function fetchPositions() {
  try {
    // 포지션은 빈 배열도 정상(보유 없음) → mock fallback 하면 안 됨
    let res;
    try {
      const r = await fetch('/api/positions/stock');
      res = await r.json();
      if (!res.success) throw new Error('api fail');
    } catch {
      // mock fallback 제거 → 빈 포지션으로 표시
      res = { success: true, data: [], account: null };
    }
    const data = res.data;
    const account = res.account; // KIS output2 계좌 요약
    const tbody=document.getElementById('pos-tbody');

    // 계좌 요약 KPI 업데이트 (실계좌 데이터 우선)
    if (account && account.total_eval > 0) {
      const el=id=>document.getElementById(id);
      el('s-total-eval').textContent = account.total_eval.toLocaleString();
      el('s-eval').textContent        = account.stock_eval.toLocaleString();
      el('s-cash').textContent        = account.cash.toLocaleString();
      el('s-pnl').textContent         = fmt(account.pnl);
      el('s-pnl').className           = 'kpi-value ' + pc(account.pnl);
      el('s-pnl-rate').textContent    = (account.pnl_rate>=0?'+':'') + account.pnl_rate.toFixed(2) + '%';
    }

    if (!data||!data.length) {
      tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">보유 종목 없음</td></tr>';
      document.getElementById('s-pos-cnt').textContent='0종목';
      return;
    }
    document.getElementById('s-pos-cnt').textContent = data.length + '종목';

    // account 없으면(mock) 직접 계산
    if (!account || !account.total_eval) {
      let totalEval=0, totalPnl=0;
      data.forEach(p=>{ totalEval+=(p.cur_price||0)*(p.qty||0); totalPnl+=(p.pnl||0); });
      document.getElementById('s-eval').textContent = Math.round(totalEval).toLocaleString();
      document.getElementById('s-total-eval').textContent = Math.round(totalEval).toLocaleString();
      document.getElementById('s-pnl').textContent = fmt(totalPnl);
      document.getElementById('s-pnl').className = 'kpi-value ' + pc(totalPnl);
    }

    tbody.innerHTML='';
    data.forEach(p=>{
      const cls=pc(p.pnl||0);
      const barW=Math.min(Math.abs(p.pnl_rate||0)*8,100);
      const barColor=p.pnl_rate>=0?'var(--green)':'var(--red)';
      tbody.innerHTML+=`<tr>
        <td><div class="tk-name">${p.name||p.symbol}</div><div class="tk-code">${p.symbol}</div></td>
        <td class="nr2 neu">${p.qty}주</td>
        <td class="nr2 neu">${(p.avg_price||0).toLocaleString()}</td>
        <td class="nr2 neu">${(p.cur_price||0).toLocaleString()}</td>
        <td class="nr2 ${cls}">${fmt(p.pnl)}</td>
        <td><div class="pct-row"><div class="pct-bar"><div class="pct-fill" style="width:${barW}%;background:${barColor}"></div></div><span class="nr2 ${cls}">${p.pnl_rate>=0?'+':''}${(p.pnl_rate||0).toFixed(1)}%</span></div></td>
      </tr>`;
    });
  } catch(e){ console.warn('positions', e); }
}

// 전략
async function fetchStrategies() {
  try {
    const { data } = await fetchWithFallback('/api/strategies?bot=stock_trader','/api/strategies?bot=stock_trader');
    const list=document.getElementById('strat-list');
    if (!data||!data.length) { list.innerHTML='<div class="empty-msg">전략 없음</div>'; return; }
    list.innerHTML='';
    data.forEach(s=>{
      const params=s.params||{};
      const paramStr=Object.entries(params).slice(0,3).map(([k,v])=>`<span class="sp">${k} <span>${v}</span></span>`).join('');
      list.innerHTML+=`
        <div class="strat-item ${s.is_active?'active-s':''}">
          <div class="sh"><span class="sn">${s.name}</span><span class="spill ${s.is_active?'on':'off'}">${s.is_active?'ON':'OFF'}</span></div>
          <div class="sparams">${paramStr}</div>
          ${s.is_active?`<div class="ssig"><div class="sig-dot" style="background:var(--green)"></div><span style="color:var(--green);font-size:10px;">활성 — 신호 감지 중</span></div>`:''}
        </div>`;
    });
  } catch(e){}
}

// 매매 이력
async function fetchHistory() {
  try {
    let data;
    try {
      const r = await fetch('/api/trades?bot=stock_trader&limit=10');
      const j = await r.json();
      data = j.success ? j.data : [];
    } catch { data = []; }
    const list=document.getElementById('hist-list');
    if (!data||!data.length) { list.innerHTML='<div class="empty-msg">매매 이력 없음</div>'; return; }
    list.innerHTML='';
    data.forEach(t=>{
      const time=new Date(t.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      const pnl=t.pnl!=null?(t.pnl>=0?'+':'')+Math.round(t.pnl).toLocaleString()+'원':'보유중';
      const pnlCls=t.pnl!=null?(t.pnl>=0?'pos':'neg'):'pend';
      list.innerHTML+=`<div class="hist-item">
        <span class="h-time">${time}</span>
        <span class="h-tag ${t.side==='BUY'?'tag-buy':'tag-sell'}">${t.side==='BUY'?'매수':'매도'}</span>
        <span class="h-name">${t.symbol}</span>
        <span class="h-price">${(t.price||0).toLocaleString()}×${t.quantity}주</span>
        <span class="h-res ${pnlCls}">${pnl}</span>
      </div>`;
    });
  } catch(e){}
}

// 종목 관리
const DEFAULT_SYMBOLS = {
  '005930': '삼성전자', '000660': 'SK하이닉스', '035420': 'NAVER',
  '035720': '카카오', '005380': '현대차', '068270': '셀트리온',
  '373220': 'LG에너지솔루션', '323410': '카카오뱅크'
};

function getSymbols() {
  const saved = localStorage.getItem('watchSymbols');
  return saved ? JSON.parse(saved) : DEFAULT_SYMBOLS;
}

function saveSymbols(symbols) {
  localStorage.setItem('watchSymbols', JSON.stringify(symbols));
  renderSymbolList();
  fetchWatchlist();
}

function toggleSymbolManager() {
  const el = document.getElementById('symbol-manager');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  renderSymbolList();
}

function renderSymbolList() {
  const symbols = getSymbols();
  const el = document.getElementById('symbol-list');
  el.innerHTML = Object.entries(symbols).map(([code, name]) => `
    <div style="display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px;">
      <span style="font-size:11px;color:var(--bright);font-family:var(--mono);">${code}</span>
      <span style="font-size:11px;color:var(--muted);">${name}</span>
      <button onclick="removeSymbol('${code}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:0 2px;">✕</button>
    </div>
  `).join('');
}

function addSymbol() {
  const code = document.getElementById('new-symbol').value.trim();
  const name = document.getElementById('new-symbol-name').value.trim() || code;
  if (!code) return;
  const symbols = getSymbols();
  symbols[code] = name;
  saveSymbols(symbols);
  document.getElementById('new-symbol').value = '';
  document.getElementById('new-symbol-name').value = '';
}

function removeSymbol(code) {
  const symbols = getSymbols();
  delete symbols[code];
  saveSymbols(symbols);
}

// 관심 종목 실시간 시세
async function fetchWatchlist() {
  try {
    const { data } = await fetchWithFallback('/api/prices/stock','/api/mock/prices/stock');
    const list=document.getElementById('watch-list');
    if (!data||!Object.keys(data).length) { list.innerHTML='<div class="empty-msg">시세 데이터 없음</div>'; return; }
    list.innerHTML='';
    Object.entries(data).forEach(([symbol, p], i)=>{
      const cls=p.change_rate>=0?'pos':'neg';
      const sign=p.change_rate>=0?'+':'';
      list.innerHTML+=`<div class="wi">
        <div class="wi-left">
          <span class="wi-rank">${i+1}</span>
          <div><div class="wi-name">${p.name||symbol}</div><div class="wi-code">${symbol}</div></div>
        </div>
        <div class="wi-right">
          <span class="wi-price">${Math.round(p.price||0).toLocaleString()}원</span>
          <span class="wi-chg ${cls}">${sign}${(p.change_rate||0).toFixed(2)}%</span>
        </div>
      </div>`;
    });
  } catch(e){}
}

async function loadAll() {
  await Promise.all([fetchStatus(), fetchSummary(), fetchPositions(), fetchStrategies(), fetchHistory(), fetchWatchlist()]);
}

loadAll();
setInterval(fetchStatus, 10000);
setInterval(fetchWatchlist, 5000);   // 관심종목 5초 갱신
setInterval(() => { fetchSummary(); fetchPositions(); fetchHistory(); }, 30000);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AutoTrader — 로그</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="theme-color" content="#0a0e14">
<style>
:root{--bg:#0a0e14;--surface:#131920;--border:#232d3a;--text:#e6edf3;--dim:#7d8896;
      --up:#f6465d;--down:#2f8fff;--gold:#f0b90b;--green:#16c784;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;padding-bottom:76px;}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;
       justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
h1{font-size:17px;}
.sub{font-size:12px;color:var(--dim);margin-top:2px;}
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;
      padding:12px 14px;margin:8px 12px;}
.item .t{font-size:13px;font-weight:700;}
.item .b{font-size:12px;color:var(--dim);margin-top:4px;white-space:pre-wrap;}
.item .ts{font-size:10px;color:var(--dim);margin-top:6px;}
.item.unread{border-left:3px solid var(--gold);}
.empty{text-align:center;color:var(--dim);padding:40px 0;}
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--dim);text-decoration:none;}
.bn-item.active{color:var(--gold);}
.bn-icon{font-size:20px;line-height:1;}
.act-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.act-btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.act-btn.ok{background:#16c784;color:#000;}.act-btn.no{background:#3a2a2a;color:#f6465d;border:1px solid #5a3a3a;}
.act-btn:disabled{opacity:.5;}
.act-done{font-size:11px;color:#7d8896;}

</style>
</head>
<body>
<header>
  <div><h1>📋 로그 / 알림</h1><div class="sub" id="sub">불러오는 중...</div></div>
</header>
<div id="list"><div class="empty">불러오는 중...</div></div>

<nav class="bottom-nav">
  <a href="/" class="bn-item"><span class="bn-icon">⊞</span>홈</a>
  <a href="/strategy" class="bn-item"><span class="bn-icon">⚙️</span>전략</a>
  <a href="/jarvis.html" class="bn-item"><span class="bn-icon">🤖</span>자비스</a>
  <a href="/training" class="bn-item"><span class="bn-icon">🎓</span>트레이닝</a>
  <a href="/logs" class="bn-item active"><span class="bn-icon">📋</span>로그</a>
</nav>

<script>
// ── 승인 버튼 공용 ──
function renderActions(actions, sid){
  if(!actions||!actions.length) return '';
  return '<div class="act-row">'+actions.map(a=>a.alive
    ? `<button class="act-btn ${a.data.includes(':ok:')?'ok':'no'}" onclick="doAction('${a.data}',this,'${sid||''}')">${a.label}</button>`
    : `<span class="act-done">${a.label.replace(/[✅❌]\s*/,'')} · 처리/만료</span>`).join('')+'</div>';
}
async function doAction(data, btn, sid){
  if(!confirm((data.includes(':ok:')?'승인':'거절')+' 하시겠어요?')) return;
  const row = btn.closest('.act-row'); if(row) row.querySelectorAll('button').forEach(b=>b.disabled=true);
  try{
    const r=await fetch('/api/jarvis/action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data, session_id: sid||'web'})});
    const j=await r.json();
    if(row) row.innerHTML='<span class="act-done">'+(j.reply||'처리됨').replace(/</g,'&lt;').slice(0,160)+'</span>';
  }catch(e){ if(row) row.innerHTML='<span class="act-done">❌ 처리 실패</span>'; }
}
function renderBtnMarkers(text, sid){
  // [[BTN:data|label]] 마커 → 버튼
  const acts=[]; const clean=text.replace(/\[\[BTN:([^|\]]+)\|([^\]]+)\]\]/g,(m,d,l)=>{acts.push({data:d,label:l,alive:true});return '';});
  return {text:clean.trim(), html:renderActions(acts, sid)};
}

async function load(){
  try{
    const r = await fetch('/api/notifications?limit=50');
    const j = await r.json();
    const el = document.getElementById('list');
    document.getElementById('sub').textContent =
      `전체 ${ (j.data||[]).length }건 · 읽지 않음 ${ j.unread||0 }건`;
    if(!j.data || !j.data.length){
      el.innerHTML = '<div class="empty">알림이 아직 없습니다</div>'; return;
    }
    el.innerHTML = j.data.map(n=>{
      const t = new Date(n.created_at);
      const ts = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      let body=(n.body||'');
      const title=(n.title||'');
      if(body.startsWith(title)) body=body.slice(title.length).trim();
      return `<div class="item ${n.is_read?'':'unread'}">
        <div class="t">${title.replace(/</g,'&lt;')}</div>
        ${body?`<div class="b">${body.replace(/</g,'&lt;')}</div>`:''}
        ${renderActions(n.actions,'web')}
        <div class="ts">${ts}</div></div>`;
    }).join('');
    fetch('/api/notifications/read',{method:'POST'}).catch(()=>{});
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="empty">불러오기 실패</div>';
  }
}
load();
setInterval(load, 20000);
</script>

<style id="unified-nav">
.bottom-nav, .nav {
  display:flex !important; position:fixed !important; bottom:0 !important;
  left:0 !important; right:0 !important; z-index:50 !important;
  background:#131920 !important; border-top:1px solid #232d3a !important;
  padding:0 0 env(safe-area-inset-bottom) 0 !important; margin:0 !important;
  height:calc(56px + env(safe-area-inset-bottom)) !important;
}
.bottom-nav a, .nav a, .bn-item {
  flex:1 !important; display:flex !important; flex-direction:column !important;
  align-items:center !important; justify-content:center !important;
  gap:2px !important; padding:0 !important; margin:0 !important;
  font-size:11px !important; font-weight:600 !important;
  color:#7d8896 !important; text-decoration:none !important; line-height:1.2 !important;
}
.bottom-nav a.active, .nav a.active, .bn-item.active { color:#f0b90b !important; }
.bn-icon, .nav-ic { font-size:20px !important; line-height:1 !important; }
body { padding-bottom:calc(64px + env(safe-area-inset-bottom)) !important; }
</style>
</body>
</html>

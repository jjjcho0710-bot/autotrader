<style>.embed{width:100%;height:100vh;border:none;display:block;}</style>
<iframe class="embed" src="/training" onload="try{
  const d=this.contentDocument, w=this.contentWindow;
  function killNav(){
    d.querySelectorAll(".bottom-nav,.nav").forEach(el=>el.remove());
    d.body.style.paddingBottom="20px";
  }
  killNav();
  new w.MutationObserver(killNav).observe(d.body,{childList:true,subtree:true});
}catch(e){}"></iframe>

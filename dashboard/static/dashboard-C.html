<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AutoTrader — 대시보드</title>
<style>
:root[data-theme="dark"]{--bg:#0d1421;--panel:#1a2332;--card:#1e2d40;--border:#2a3a4e;--text:#e8edf3;--muted:#8b95a1;--up:#f75467;--dn:#4386f9;--accent:#1763b6;--header:#111827;--green:#22c55e;}
:root[data-theme="light"]{--bg:#f4f6f9;--panel:#ffffff;--card:#ffffff;--border:#e2e8f0;--text:#1a2332;--muted:#8b95a1;--up:#e02020;--dn:#1763b6;--accent:#1763b6;--header:#ffffff;--green:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Pretendard',sans-serif;font-size:14px;}
body{display:flex;flex-direction:column;overflow-y:auto;}

.header{background:var(--header);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:12px;}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;}
.live-badge{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--green);background:rgba(34,197,94,0.1);padding:3px 8px;border-radius:12px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* KPI 섹션 */
.kpi-section{padding:12px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
.kpi-val{font-size:20px;font-weight:800;font-family:'SF Mono',monospace;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px;}

/* 봇 상태 섹션 */
.bots-section{padding:0 12px 12px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.overall-badge{font-size:11px;font-weight:600;color:var(--green);}
.bot-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.bot-left{display:flex;align-items:center;gap:12px;}
.bot-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
.bot-stk{background:#1763b6;}
.bot-cry{background:#f59e0b;}
.bot-dat{background:#22c55e;}
.bot-info{display:flex;flex-direction:column;gap:2px;}
.bot-name{font-size:14px;font-weight:700;}
.bot-desc{font-size:11px;color:var(--muted);}
.bot-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.bot-status{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--green);}
.bot-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.bot-pnl{font-size:15px;font-weight:800;}

/* 이벤트 섹션 */
.events-section{padding:0 12px 80px;}
.event-item{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.event-badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;white-space:nowrap;}
.badge-buy{background:rgba(247,84,103,0.15);color:var(--up);}
.badge-sell{background:rgba(67,134,249,0.15);color:var(--dn);}
.event-info{flex:1;}
.event-title{font-size:13px;font-weight:600;}
.event-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.event-amount{font-size:13px;font-weight:700;white-space:nowrap;}

.up{color:var(--up);}
.dn{color:var(--dn);}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px;}

.bottom-nav{background:var(--header);border-top:1px solid var(--border);display:flex;height:56px;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:500;}
.bn-item.active{color:var(--accent);}
.bn-icon{font-size:22px;line-height:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">AutoTrader</div>
  <div class="header-right">
    <span id="clock" style="font-size:12px;color:var(--muted)"></span>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
  </div>
</div>

<!-- KPI -->
<div class="kpi-section">
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">총 평가금액</div>
      <div class="kpi-val" id="total-eval">-</div>
      <div class="kpi-sub">원 (주식+코인)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">오늘 수익</div>
      <div class="kpi-val" id="today-pnl">-</div>
      <div class="kpi-sub">원</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">누적 수익</div>
      <div class="kpi-val" id="total-pnl">-</div>
      <div class="kpi-sub">원</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">오늘 체결</div>
      <div class="kpi-val" id="today-trades">-</div>
      <div class="kpi-sub">건</div>
    </div>
  </div>
</div>

<!-- 봇 상태 -->
<div class="bots-section">
  <div class="section-title">
    봇 상태
    <span class="overall-badge" id="overall-badge">● 전체 정상</span>
  </div>
  <div class="bot-card">
    <div class="bot-left">
      <div class="bot-avatar bot-stk">STK</div>
      <div class="bot-info">
        <div class="bot-name">stock-trader</div>
        <div class="bot-desc" id="stk-desc">KIS API · 확인 중...</div>
      </div>
    </div>
    <div class="bot-right">
      <div class="bot-status"><span class="bot-status-dot"></span>운영중</div>
      <div class="bot-pnl up" id="stk-pnl">-</div>
    </div>
  </div>
  <div class="bot-card">
    <div class="bot-left">
      <div class="bot-avatar bot-cry">CRY</div>
      <div class="bot-info">
        <div class="bot-name">crypto-trader</div>
        <div class="bot-desc" id="cry-desc">업비트 · 확인 중...</div>
      </div>
    </div>
    <div class="bot-right">
      <div class="bot-status"><span class="bot-status-dot"></span>운영중</div>
      <div class="bot-pnl up" id="cry-pnl">-</div>
    </div>
  </div>
  <div class="bot-card">
    <div class="bot-left">
      <div class="bot-avatar bot-dat">DAT</div>
      <div class="bot-info">
        <div class="bot-name">data-collector</div>
        <div class="bot-desc" id="dat-desc">1분봉 수집 중</div>
      </div>
    </div>
    <div class="bot-right">
      <div class="bot-status"><span class="bot-status-dot"></span>운영중</div>
      <div class="bot-pnl" id="dat-pnl" style="color:var(--muted)">-</div>
    </div>
  </div>
</div>

<!-- 오늘 이벤트 -->
<div class="events-section">
  <div class="section-title">오늘 주요 이벤트</div>
  <div id="event-list"><div class="empty">이벤트 없음</div></div>
</div>

<nav class="bottom-nav">
  <a href="dashboard-C.html" class="bn-item active"><span class="bn-icon">⊞</span>대시보드</a>
  <a href="stock.html" class="bn-item"><span class="bn-icon">📈</span>주식</a>
  <a href="crypto.html" class="bn-item"><span class="bn-icon">₿</span>코인</a>
  <a href="strategy.html" class="bn-item"><span class="bn-icon">⚙</span>전략</a>
  <a href="jarvis.html" class="bn-item"><span class="bn-icon">🤖</span>Jarvis</a>
</nav>

<script>
const API='';
function fmt(n){return Number(n||0).toLocaleString();}

function toggleTheme(){
  const h=document.documentElement;
  const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-icon').textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'light':'dark');
}
const t=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',t);
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('theme-icon').textContent=t==='dark'?'🌙':'☀️';});

function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000);updateClock();

async function loadDashboard(){
  try{
    // 주식 포지션
    const sr=await fetch(`${API}/api/positions/stock`);
    const sd=await sr.json();
    const stk_pnl=sd.account?.pnl||0;
    document.getElementById('stk-pnl').textContent=(stk_pnl>=0?'+':'')+fmt(Math.round(stk_pnl))+'원';
    document.getElementById('stk-pnl').className='bot-pnl '+(stk_pnl>=0?'up':'dn');
    document.getElementById('stk-desc').textContent=`KIS API · ${sd.data?.length||0}종목 보유`;

    // 코인 포지션
    const cr=await fetch(`${API}/api/positions/crypto`);
    const cd=await cr.json();
    const cry_pnl=cd.account?.pnl||0;
    document.getElementById('cry-pnl').textContent=(cry_pnl>=0?'+':'')+fmt(Math.round(cry_pnl))+'원';
    document.getElementById('cry-pnl').className='bot-pnl '+(cry_pnl>=0?'up':'dn');
    const krw=cd.account?.krw_balance||0;
    document.getElementById('cry-desc').textContent=`업비트 · KRW ${fmt(Math.round(krw))}원`;

    // 총 평가
    const total=(sd.account?.total_eval||0)+(cd.account?.total_assets||krw);
    document.getElementById('total-eval').textContent=fmt(Math.round(total));

    // 총 수익
    const totalPnl=stk_pnl+cry_pnl;
    const tpEl=document.getElementById('total-pnl');
    tpEl.textContent=(totalPnl>=0?'+':'')+fmt(Math.round(totalPnl));
    tpEl.className='kpi-val '+(totalPnl>=0?'up':'dn');

    // 오늘 거래
    const tr=await fetch(`${API}/api/trades?limit=50`);
    const td=await tr.json();
    const today=new Date().toDateString();
    const todayTrades=(td.data||[]).filter(t=>new Date(t.ts||t.created_at).toDateString()===today);
    document.getElementById('today-trades').textContent=todayTrades.length;
    const todayPnl=todayTrades.reduce((s,t)=>s+parseFloat(t.pnl||0),0);
    const tpdEl=document.getElementById('today-pnl');
    tpdEl.textContent=(todayPnl>=0?'+':'')+fmt(Math.round(todayPnl));
    tpdEl.className='kpi-val '+(todayPnl>=0?'up':'dn');

    // 이벤트 리스트
    const list=document.getElementById('event-list');
    if(!todayTrades.length){list.innerHTML='<div class="empty">오늘 거래 없음</div>';return;}
    list.innerHTML=todayTrades.slice(0,10).map(t=>{
      const isBuy=t.side==='BUY';
      const time=new Date(t.ts||t.created_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      return `<div class="event-item">
        <span class="event-badge ${isBuy?'badge-buy':'badge-sell'}">${t.side}</span>
        <div class="event-info">
          <div class="event-title">${t.name||t.symbol} ${fmt(t.price)}원</div>
          <div class="event-sub">${t.strategy||''} · ${time}</div>
        </div>
        <div class="event-amount">${fmt(Math.round(t.amount||0))}원</div>
      </div>`;
    }).join('');
  }catch(e){console.error(e);}
}

loadDashboard();
setInterval(loadDashboard,30000);
</script>
</body>
</html>

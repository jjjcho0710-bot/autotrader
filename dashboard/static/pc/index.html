<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTrader — PC</title>
<link rel="stylesheet" href="/static/pc/pc-common.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{height:100vh;display:flex;overflow:hidden;}
/* 사이드바 */
.side{width:216px;min-width:216px;flex-shrink:0;background:var(--p);border-right:1px solid var(--bd);
      display:flex;flex-direction:column;padding:18px 12px;position:relative;z-index:100;}
.logo{font-size:17px;font-weight:800;color:var(--br);padding:0 10px 18px;}
.logo span{color:var(--gd);}
.jbtn{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;
      background:linear-gradient(145deg,rgba(188,140,255,.14),rgba(188,140,255,.05));
      border:1px solid rgba(188,140,255,.3);cursor:pointer;margin-bottom:16px;}
.jbtn.on{background:linear-gradient(145deg,rgba(188,140,255,.3),rgba(188,140,255,.12));}
.jav{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--pu),#7c5fe0);
     display:flex;align-items:center;justify-content:center;font-size:19px;
     box-shadow:0 0 18px rgba(188,140,255,.35);}
.jname{font-weight:800;color:var(--br);font-size:14px;}
.jst{font-size:10px;color:var(--gr);}
.navlbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;padding:6px 12px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
          color:var(--dim);cursor:pointer;font-weight:600;font-size:13px;margin-bottom:2px;}
.nav-item:hover{background:var(--p2);color:var(--tx);}
.nav-item.on{background:var(--p2);color:var(--gd);}
.nav-item .ic{font-size:17px;width:22px;text-align:center;}
.side-foot{margin-top:auto;padding:10px 12px;font-size:10px;color:var(--dim);}
.side-foot a{color:var(--dim);}
/* 메인 */
.main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-left:20px;}
#page{min-height:100%;}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:var(--dim);background:var(--bg);}
/* 좁은 창: 700px 이하에서 사이드바를 아이콘만 남기고 접는다 (화면을 막지 않음) */
@media(max-width:700px){
  .side{width:64px;min-width:64px;padding:14px 8px;align-items:center;}
  .logo{font-size:0;padding:0 0 14px;}
  .logo::before{content:"AT";font-size:15px;font-weight:800;color:var(--br);}
  .jbtn{padding:8px;justify-content:center;gap:0;}
  .jbtn>div:last-child{display:none;}
  .navlbl{display:none;}
  .nav-item{font-size:0;gap:0;justify-content:center;padding:11px 0;width:100%;}
  .nav-item .ic{font-size:18px;}
  .side-foot{padding:10px 0;font-size:0;text-align:center;align-self:stretch;}
  .side-foot a{font-size:10px;display:block;word-break:keep-all;}
  .main{padding-left:12px;}
}
</style>
</head>
<body>
<aside class="side">
  <div class="logo">Auto<span>Trader</span></div>
  <div class="jbtn" id="nav-jarvis" title="한강뷰매니저" onclick="go('jarvis')">
    <div class="jav">🤖</div>
    <div><div class="jname">한강뷰매니저</div><div class="jst" id="jstatus">● 온라인</div></div>
  </div>
  <div class="navlbl">메뉴</div>
  <div class="nav-item on" id="nav-home" title="홈" onclick="go('home')"><span class="ic">⊞</span>홈</div>
  <div class="nav-item" id="nav-stock" title="포트폴리오" onclick="go('stock')"><span class="ic">📈</span>포트폴리오</div>
  <div class="nav-item" id="nav-stark" title="판단 로그" onclick="go('stark')"><span class="ic">🧠</span>판단 로그</div>
  <div class="nav-item" id="nav-strategy" title="전략/설정" onclick="go('strategy')"><span class="ic">⚙️</span>전략/설정</div>
  <div class="nav-item" id="nav-training" title="학습 자료" onclick="go('training')"><span class="ic">🎓</span>학습 자료</div>
  <div class="nav-item" id="nav-logs" title="시스템 로그" onclick="go('logs')"><span class="ic">📋</span>시스템 로그</div>
  <div class="side-foot">v1.0 · <a href="/">모바일 버전</a></div>
</aside>
<main class="main"><div id="page"><div class="loading">불러오는 중...</div></div></main>
<script>
let cur = null;
const timers = [];
function clearTimers(){ while(timers.length) clearInterval(timers.pop()); }
window.addTimer = fn_ms => { /* pages register intervals */ };
window.regInterval = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };

function _fragVer(){ return Math.floor(Date.now()/300000); } // 5분 단위 캐시버전 — 코드 변경 후 최대 5분 내 자동 반영
async function go(name){
  if (cur === name) return;
  cur = name;
  clearTimers();
  document.querySelectorAll('.nav-item,.jbtn').forEach(e=>e.classList.remove('on'));
  const btn = document.getElementById('nav-'+name);
  if (btn) btn.classList.add('on');
  const pg = document.getElementById('page');
  pg.innerHTML = '<div class="loading">불러오는 중...</div>';
  try{
    const r = await fetch(`/static/pc/pages/${name}.html?v=${_fragVer()}`);
    const html = await r.text();
    pg.innerHTML = html;
    // innerHTML 스크립트는 실행 안 되므로 재생성
    pg.querySelectorAll('script').forEach(old=>{
      const s = document.createElement('script');
      if (old.src) s.src = old.src; else s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }catch(e){
    pg.innerHTML = '<div class="loading">페이지 로드 실패</div>';
  }
}
go('home');
// 조각 파일 사전 로드 → 메뉴 전환 즉시
setTimeout(()=>{['jarvis','strategy','stark','training','logs'].forEach(n=>
  fetch(`/static/pc/pages/${n}.html?v=${_fragVer()}`).catch(()=>{}));}, 1500);
// 자비스 상태 점검
setInterval(async()=>{
  try{const r=await fetch('/api/status');const j=await r.json();
    const s=j.data||j; const b=typeof s.stock_trader==='string'?JSON.parse(s.stock_trader):s.stock_trader;
    document.getElementById('jstatus').textContent = b&&b.status==='running'?'● 온라인 · 봇 관리 중':'● 온라인';
  }catch(e){}
}, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoTrader — 전략</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#f5f6fa;--panel:#ffffff;--panel2:#f9fafb;--border:#d1d5db;
  --stock:#1261c4;--crypto:#b45309;--green:#059669;--red:#dc2626;
  --purple:#6d28d9;--muted:#6b7280;--text:#374151;--bright:#111827;
  --sidebar:200px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
*::-webkit-scrollbar{width:4px;}
*::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;height:100vh;display:flex;overflow:hidden;}

.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;}
.sidebar-logo{height:56px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid var(--border);}
.logo-mark{width:32px;height:32px;background:var(--stock);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:white;font-weight:700;}
.logo-text{font-size:14px;font-weight:700;color:var(--bright);}
.logo-sub{font-size:10px;color:var(--muted);font-weight:500;margin-top:1px;}
.sidebar-section{padding:12px 16px 4px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;}
.sidebar-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:2px;}
.nav-item{width:100%;height:38px;border-radius:8px;display:flex;align-items:center;padding:0 10px;gap:10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all 0.1s;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:#f5f3ff;color:var(--purple);font-weight:600;}
.nav-item.active.d{background:#eff6ff;color:var(--stock);}
.nav-item.active.s{background:#eff6ff;color:var(--stock);}
.nav-item.active.c{background:#fef3c7;color:var(--crypto);}
.nav-item.active.l{background:#f0fdf4;color:var(--green);}
.nav-item.active.j{background:#f5f3ff;color:var(--purple);}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.sidebar-bottom{padding:12px 8px;border-top:1px solid var(--border);}
.sdot-row{display:flex;gap:12px;padding:6px 8px;}
.sdot-item{display:flex;align-items:center;gap:5px;}
.sdot{width:8px;height:8px;border-radius:50%;background:#d1d5db;}
.sdot.on{background:var(--green);}
.sdot-label{font-size:11px;color:#374151;font-weight:700;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;}
.page-title{font-size:15px;font-weight:700;color:var(--bright);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--green);background:#f0fdf4;padding:4px 10px;border-radius:20px;border:1px solid #bbf7d0;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.clock{font-size:12px;color:var(--muted);font-family:var(--mono);font-weight:500;}

.content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.section-dot{width:10px;height:10px;border-radius:50%;}
.section-title{font-size:14px;font-weight:700;color:var(--bright);}
.section-sub{font-size:12px;color:var(--muted);font-weight:500;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

.strat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.strat-card.active-card{border-color:#a7f3d0;}
.strat-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.strat-header.active{background:#f0fdf4;border-bottom-color:#a7f3d0;}
.strat-header.inactive{background:#f9fafb;}
.strat-info{flex:1;}
.strat-name{font-size:14px;font-weight:700;color:var(--bright);}
.strat-desc{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500;}
.toggle{width:40px;height:22px;border-radius:11px;position:relative;cursor:pointer;flex-shrink:0;transition:background 0.2s;}
.toggle.on{background:var(--green);}
.toggle.off{background:#d1d5db;}
.toggle::after{content:'';position:absolute;width:16px;height:16px;background:white;border-radius:50%;top:3px;transition:left 0.2s;}
.toggle.on::after{left:21px;}
.toggle.off::after{left:3px;}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
.status-pill.on{background:#d1fae5;color:#065f46;}
.status-pill.off{background:#f3f4f6;color:var(--muted);}
.sensing{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--green);}
.sensing-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}

.strat-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.param-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.param-item{display:flex;flex-direction:column;gap:4px;}
.param-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.param-input{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:13px;font-family:var(--mono);font-weight:600;color:var(--bright);background:var(--panel2);width:100%;outline:none;transition:border 0.15s;}
.param-input:focus{border-color:var(--stock);background:white;}
.strat-footer{display:flex;justify-content:space-between;align-items:center;padding-top:4px;}
.perf-row{display:flex;gap:16px;}
.perf-item{font-size:11px;color:var(--muted);font-weight:500;}
.perf-item b{color:var(--bright);font-weight:700;}
.save-btn{height:36px;padding:0 20px;background:var(--stock);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity 0.15s;}
.save-btn:hover{opacity:0.85;}
.save-btn.crypto{background:var(--crypto);}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;display:none;}
.toast.ok{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;}
.toast.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}

/* ── 모바일 하단 네비게이션 ── */
.bottom-nav{display:none;}
@media (max-width: 768px) {
  .sidebar{display:none!important;}
  .main{margin-left:0!important;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--panel);border-top:1px solid var(--border);
    height:60px;z-index:1000;
  }
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;cursor:pointer;
    color:var(--muted);font-size:10px;font-weight:500;
    transition:color 0.1s;text-decoration:none;
  }
  .bottom-nav-item.active{color:var(--stock);}
  .bottom-nav-item .bn-icon{font-size:20px;line-height:1;}
  .main{padding-bottom:70px;}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">AT</div>
    <div>
      <div class="logo-text">AutoTrader</div>
      <div class="logo-sub">AI 자동매매 시스템</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section">메뉴</div>
    <div class="nav-item d" onclick="location.href='dashboard-C.html'"><span class="nav-icon">⊞</span>대시보드</div>
    <div class="nav-item s" onclick="location.href='stock.html'"><span class="nav-icon">📈</span>주식</div>
    <div class="nav-item c" onclick="location.href='crypto.html'"><span class="nav-icon">₿</span>코인</div>
    <div class="nav-item active t" onclick="location.href='strategy.html'"><span class="nav-icon">⚙</span>전략</div>
    <div class="nav-item l" onclick="location.href='/analysis.html'"><span class="nav-icon">🧠</span>분석</div>
    <div class="sidebar-section">AI</div>
    <div class="nav-item j" onclick="location.href='jarvis.html'"><span class="nav-icon">🤖</span>Jarvis</div>
  </div>
  <div class="sidebar-bottom">
    <div class="sdot-row">
      <div class="sdot-item"><div class="sdot" id="dot-stk"></div><span class="sdot-label">STK</span></div>
      <div class="sdot-item"><div class="sdot" id="dot-cry"></div><span class="sdot-label">CRY</span></div>
      <div class="sdot-item"><div class="sdot" id="dot-dat"></div><span class="sdot-label">DAT</span></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="page-title">전략 관리</div>
    <div class="topbar-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="content">
    <!-- 주식 전략 -->
    <div>
      <div class="section-header">
        <div class="section-dot" style="background:var(--stock)"></div>
        <div>
          <div class="section-title">STOCK-TRADER</div>
          <div class="section-sub">한국주식 · KIS API</div>
        </div>
      </div>
    </div>
    <div class="grid-2" id="stock-strategies"></div>

    <!-- 코인 전략 -->
    <div style="margin-top:8px">
      <div class="section-header">
        <div class="section-dot" style="background:var(--crypto)"></div>
        <div>
          <div class="section-title">CRYPTO-TRADER</div>
          <div class="section-sub">코인 · 업비트 API</div>
        </div>
      </div>
    </div>
    <div class="grid-2" id="crypto-strategies"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='';
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(updateClock,1000);updateClock();

function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type}`;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

function buildParamInputs(params){
  return Object.entries(params||{}).map(([k,v])=>`
    <div class="param-item">
      <div class="param-label">${k}</div>
      <input class="param-input" name="${k}" value="${v}" type="${typeof v==='number'?'number':'text'}" step="any">
    </div>`).join('');
}

function renderStrategies(data, containerId, bot){
  const el=document.getElementById(containerId);
  if(!data.length){el.innerHTML='<div style="color:var(--muted);font-size:12px;padding:8px">전략 없음</div>';return;}
  el.innerHTML=data.map(s=>{
    const on=s.is_active;
    const isCrypto=bot==='crypto';
    return `<div class="strat-card ${on?'active-card':''}">
      <div class="strat-header ${on?'active':'inactive'}">
        <div class="strat-info">
          <div class="strat-name">${s.name}</div>
          <div class="strat-desc">${s.description||''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          ${on?`<div class="sensing"><div class="sensing-dot"></div>신호 감지 중</div>`:''}
          <div class="toggle ${on?'on':'off'}" data-bot="${s.bot}" data-name="${s.name}" data-active="${on}" onclick="toggleStrategy(this)"></div>
          <span class="status-pill ${on?'on':'off'}">${on?'ON':'OFF'}</span>
        </div>
      </div>
      <div class="strat-body">
        <div class="param-grid" data-bot="${s.bot}" data-name="${s.name}">
          ${buildParamInputs(s.params)}
        </div>
        <div class="strat-footer">
          <div class="perf-row">
            <div class="perf-item">30일 수익률 <b>-</b></div>
            <div class="perf-item">승률 <b>-</b></div>
            <div class="perf-item">총 체결 <b>-</b></div>
          </div>
          <button class="save-btn ${isCrypto?'crypto':''}" onclick="saveParams(this)">파라미터 저장</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function toggleStrategy(el){
  const bot=el.dataset.bot;
  const name=el.dataset.name;
  const wasActive=el.dataset.active==='true';
  const newActive=!wasActive;
  el.dataset.active=newActive;
  el.className=`toggle ${newActive?'on':'off'}`;
  el.nextElementSibling.textContent=newActive?'ON':'OFF';
  el.nextElementSibling.className=`status-pill ${newActive?'on':'off'}`;
  const paramGrid=el.closest('.strat-card').querySelector('.param-grid');
  const params={};
  paramGrid.querySelectorAll('input').forEach(i=>{params[i.name]=isNaN(i.value)?i.value:parseFloat(i.value);});
  try{
    const r=await fetch(`${API}/api/strategies/update`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({bot,name,is_active:newActive,params})
    });
    const res=await r.json();
    if(res.success){showToast(`${name} ${newActive?'활성화':'비활성화'}됨`,'ok');}
    else{showToast('저장 실패','err');el.dataset.active=wasActive;el.className=`toggle ${wasActive?'on':'off'}`;}
  }catch(e){showToast('서버 오류','err');}
}

async function saveParams(btn){
  const card=btn.closest('.strat-card');
  const paramGrid=card.querySelector('.param-grid');
  const bot=paramGrid.dataset.bot;
  const name=paramGrid.dataset.name;
  const params={};
  paramGrid.querySelectorAll('input').forEach(i=>{params[i.name]=isNaN(i.value)?i.value:parseFloat(i.value);});
  try{
    const r=await fetch(`${API}/api/strategies/update`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({bot,name,params})
    });
    const res=await r.json();
    showToast(res.success?`${name} 저장 완료`:'저장 실패',res.success?'ok':'err');
  }catch(e){showToast('서버 오류','err');}
}

async function loadStrategies(){
  try{
    const r=await fetch(`${API}/api/strategies`);
    const res=await r.json();
    const data=res.data||[];
    renderStrategies(data.filter(s=>s.bot==='stock_trader'),'stock-strategies','stock');
    renderStrategies(data.filter(s=>s.bot==='crypto_trader'),'crypto-strategies','crypto');
    // 봇 상태
    const sr=await fetch(`${API}/api/status`);
    const bots=(await sr.json()).data||{};
    if(bots.stock_trader?.status==='running')document.getElementById('dot-stk').className='sdot on';
    if(bots.crypto_trader?.status==='running')document.getElementById('dot-cry').className='sdot on';
    if(bots.data_collector?.status==='running')document.getElementById('dot-dat').className='sdot on';
  }catch(e){}
}
loadStrategies();
</script>
<nav class="bottom-nav">
  <a class="bottom-nav-item" href="dashboard-C.html"><span class="bn-icon">⊞</span>대시보드</a>
  <a class="bottom-nav-item" href="stock.html"><span class="bn-icon">📈</span>주식</a>
  <a class="bottom-nav-item" href="crypto.html"><span class="bn-icon">₿</span>코인</a>
  <a class="bottom-nav-item active" href="strategy.html"><span class="bn-icon">⚙</span>전략</a>
  <a class="bottom-nav-item" href="jarvis.html"><span class="bn-icon">🤖</span>Jarvis</a>
</nav>
</body>
</html>

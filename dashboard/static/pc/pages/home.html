<style>
.hp{padding:26px 34px 40px;}
.htitle{font-size:19px;color:var(--br);font-weight:800;margin-bottom:4px;}
.hsub{font-size:12px;color:var(--dim);margin-bottom:22px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px;}
.kpi{background:linear-gradient(145deg,var(--p),var(--p2));border:1px solid var(--bd);border-radius:16px;padding:17px;}
.kl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;}
.kv{font-size:19px;font-weight:800;color:var(--br);margin-top:6px;}
.ks{font-size:11px;margin-top:4px;color:var(--dim);}
.hgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{padding:6px 14px;border-radius:20px;background:var(--bd);font-size:11px;cursor:pointer;color:var(--tx);}
.tab.on{background:var(--gd);color:#000;font-weight:700;}
.bigchart{height:210px;position:relative;}
.bigchart canvas{width:100%;height:100%;}
.posmeta{display:flex;gap:22px;margin-top:12px;font-size:12px;flex-wrap:wrap;}
.wr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);font-size:12.5px;}
.wr:last-child{border:none;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{color:var(--dim);text-align:left;padding:7px 6px;font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--bd);}
td{padding:9px 6px;border-bottom:1px solid var(--bd);}
.bars{display:flex;align-items:flex-end;gap:8px;height:76px;}
.bars>div{flex:1;border-radius:4px;min-height:4px;}
.mb-8{margin-bottom:16px;}
</style>
<div class="hp">
  <div class="htitle">대시보드</div>
  <div class="hsub" id="hdate">-</div>
  <div class="kpis">
    <div class="kpi"><div class="kl">총 자산</div><div class="kv mono" id="kTotal">-</div><div class="ks" id="kTotalS"></div></div>
    <div class="kpi"><div class="kl">평가 손익</div><div class="kv mono" id="kPnl">-</div><div class="ks" id="kPnlS"></div></div>
    <div class="kpi"><div class="kl">예수금 D+2</div><div class="kv mono" id="kCash">-</div><div class="ks">출금 가능</div></div>
    <div class="kpi"><div class="kl">코스피</div><div class="kv mono" id="kKospi">-</div><div class="ks mono" id="kKospiS"></div></div>
    <div class="kpi"><div class="kl">오늘 판단</div><div class="kv mono" id="kJdg">-</div><div class="ks" id="kJdgS"></div></div>
    <div class="kpi"><div class="kl">시스템</div><div class="kv" id="kSys">-</div><div class="ks" id="kSysS"></div></div>
  </div>
  <div class="hgrid">
    <div>
      <div class="card mb-8">
        <div class="ct">보유 포지션 <small id="posCnt"></small>
          <span id="mainPeriods" style="display:flex;gap:6px;"></span></div>
        <div class="tabs" id="posTabs"></div>
        <div id="mainChart" style="height:300px;"></div>
        <div id="mainVol" style="height:70px;"></div>
        <div class="posmeta" id="posMeta"></div>
      </div>
      <div class="card">
        <div class="ct">오늘 판단 타임라인</div>
        <table><thead><tr><th>시각</th><th>종목</th><th>판정</th><th>전략</th><th>채점</th></tr></thead>
        <tbody id="tl"><tr><td colspan="5" class="empty">로딩...</td></tr></tbody></table>
      </div>
    </div>
    <div>
      <div class="card mb-8">
        <div class="ct">감시 종목 <small id="wCnt"></small></div>
        <div id="wl"><div class="empty">로딩...</div></div>
      </div>
      <div class="card mb-8">
        <div class="ct">오늘의 작전</div>
        <div id="plan" style="font-size:12px;line-height:1.9;white-space:pre-wrap;color:var(--tx);">로딩...</div>
      </div>
      <div class="card">
        <div class="ct">최근 14일 채점</div>
        <div class="bars" id="bars"><div class="empty">데이터 없음</div></div>
        <div style="display:flex;gap:14px;font-size:10px;color:var(--dim);margin-top:8px;">
          <span>🟩 적중/잘거름</span><span>🟥 빗나감/놓침</span></div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
const won=n=>Number(n||0).toLocaleString()+"원";
const pct=n=>(n>=0?"+":"")+Number(n||0).toFixed(2)+"%";
const cls=n=>n>0?"up":n<0?"dn":"";
document.getElementById('hdate').textContent =
  new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

let positions=[], activeSym=null;
const chartCache={};

async function loadKpi(){
  try{const r=await fetch('/api/account/stock');const j=await r.json();const a=j.data||{};
    kTotal.textContent=won(a.total_eval); kCash.textContent=won(a.cash);
    kPnl.textContent=won(a.pnl); kPnl.className='kv mono '+cls(a.pnl);
  }catch(e){}
  try{const r=await fetch('/api/market/index');const j=await r.json();const d=j.data||{};
    if(d.KOSPI){kKospi.textContent=d.KOSPI.price.toLocaleString();
      kKospiS.textContent=pct(d.KOSPI.change_rate);kKospiS.className='ks mono '+cls(d.KOSPI.change_rate);}
  }catch(e){}
  try{const r=await fetch('/api/journal?days=1');const j=await r.json();
    const s=j.summary||{};kJdg.textContent=(s.total_signals||0)+'건';
    kJdgS.textContent=`실행 ${s.executes||0} · 보류 ${s.skips||0}`;
  }catch(e){}
  try{const r=await fetch('/api/status');const j=await r.json();const s=j.data||j;
    const cnt=['stock_trader','crypto_trader','data_collector'].filter(k=>{
      try{const b=typeof s[k]==='string'?JSON.parse(s[k]):s[k];return b&&b.status==='running';}catch(e){return false;}}).length;
    kSys.textContent=cnt===3?'정상':cnt+'/3';
    kSys.style.color=cnt===3?'var(--gr)':'var(--gd)';
    kSysS.textContent=`봇 ${cnt}/3 가동`;
  }catch(e){}
}

async function loadPos(){
  try{const r=await fetch('/api/positions/stock');const j=await r.json();
    positions=j.data||[];
    posCnt.textContent=positions.length+'종목';
    if(!positions.length){posTabs.innerHTML='';posMeta.innerHTML='<span class="empty">보유 없음</span>';
      drawBig([]);return;}
    if(!activeSym||!positions.find(p=>p.symbol===activeSym)) activeSym=positions[0].symbol;
    posTabs.innerHTML=positions.map(p=>
      `<div class="tab ${p.symbol===activeSym?'on':''}" onclick="selPos('${p.symbol}')">${p.name||p.symbol}</div>`).join('');
    const p=positions.find(x=>x.symbol===activeSym);
    const rate=p.pnl_rate??0;
    posMeta.innerHTML=`<span>${p.qty}주 · 평단 <b style="color:var(--br)">${won(p.avg_price)}</b></span>
      <span>현재 <b style="color:var(--br)">${won(p.cur_price)}</b></span>
      <span class="${cls(p.pnl)}"><b>${won(p.pnl)} (${pct(rate)})</b></span>
      <span style="color:var(--dim)">손절 -7% 상의 · 익절 +5% 트레일링</span>
      <button onclick="openChart('${p.symbol}','${(p.name||p.symbol).replace(/'/g,"")}',${p.avg_price||0})"
        style="background:var(--bd);border:1px solid var(--bd);color:var(--gd);border-radius:8px;padding:5px 12px;font-size:11px;">📈 차트 크게</button>`;
    await drawBigFor(activeSym, p.avg_price);
  }catch(e){}
}
window.selPos=async s=>{activeSym=s;await loadPos();};

let mainPeriod='D', mChart=null, mVol=null;
function renderMainPeriods(){
  const P={'1m':'1분','5m':'5분','30m':'30분','D':'일','W':'주','M':'월'};
  document.getElementById('mainPeriods').innerHTML=Object.entries(P).map(([k,v])=>
    `<button onclick="setMainPeriod('${k}')" style="background:${k===mainPeriod?'var(--gd)':'var(--bd)'};
     color:${k===mainPeriod?'#000':'var(--tx)'};border:none;border-radius:7px;padding:5px 11px;
     font-size:11px;font-weight:700;cursor:pointer;">${v}봉</button>`).join('');
}
window.setMainPeriod=function(pd){mainPeriod=pd;renderMainPeriods();
  const p=positions.find(x=>x.symbol===activeSym);
  if(p)drawBigFor(activeSym,p.avg_price);};

function loadLW2(cb){
  if(window.LightweightCharts){cb();return;}
  const s=document.createElement('script');
  s.src='https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';
  s.onload=cb;document.head.appendChild(s);
}
function ma2(data,n){
  const out=[];for(let i=n-1;i<data.length;i++){
    let s=0;for(let k=i-n+1;k<=i;k++)s+=data[k].close;
    out.push({time:data[i].time,value:s/n});}
  return out;
}
function toTime(r, isMin){
  if(isMin){
    // KST 분봉 → epoch (lightweight-charts는 UTC 기준이라 KST 보정)
    const d=r.d, t=(r.t||'000000');
    const dt=Date.UTC(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8),
                      +t.slice(0,2), +t.slice(2,4)) / 1000;
    return dt;
  }
  return `${r.d.slice(0,4)}-${r.d.slice(4,6)}-${r.d.slice(6,8)}`;
}
async function fetchChart(sym, period){
  const isMin=period.endsWith('m');
  const days=period==='D'?90:period==='W'?300:600;
  try{const r=await fetch(`/api/chart/${sym}?period=${period}&days=${days}`);
    const j=await r.json();return j.data||[];}catch(e){return [];}
}
async function drawBigFor(sym, avg){
  loadLW2(async()=>{
    const isMin=mainPeriod.endsWith('m');
    const ck=`${sym}:${mainPeriod}`;
    // 분봉은 캐시 안함(실시간), 일/주/월만 캐시
    if(isMin || !chartCache[ck]){
      const d=await fetchChart(sym, mainPeriod);
      if(!isMin) chartCache[ck]=d;
      else chartCache[ck]=d;
    }
    const rows=chartCache[ck];
    if(mChart){mChart.remove();mChart=null;}
    if(mVol){mVol.remove();mVol=null;}
    const el=document.getElementById('mainChart');
    if(!el)return;
    if(!rows.length){el.innerHTML='<div class="empty">차트 데이터 없음</div>';return;}
    el.innerHTML='';
    const cd=rows.map(r=>({time:toTime(r,isMin),open:r.o,high:r.h,low:r.l,close:r.c}));
    const vd=rows.map(r=>({time:toTime(r,isMin),value:r.v,
      color:r.c>=r.o?'rgba(246,70,93,.5)':'rgba(56,139,253,.5)'}));
    const opt={layout:{background:{color:'transparent'},textColor:'#8b949e',fontSize:11},
      grid:{vertLines:{color:'#1c2129'},horzLines:{color:'#1c2129'}},
      crosshair:{mode:0},
      timeScale:{borderColor:'#21262d',timeVisible:isMin,secondsVisible:false},
      rightPriceScale:{borderColor:'#21262d'}};
    mChart=LightweightCharts.createChart(el,{...opt,height:300});
    const cs=mChart.addCandlestickSeries({upColor:'#f6465d',downColor:'#388bfd',
      borderUpColor:'#f6465d',borderDownColor:'#388bfd',
      wickUpColor:'#f6465d',wickDownColor:'#388bfd'});
    cs.setData(cd);
    mChart.addLineSeries({color:'#e3b341',lineWidth:1,priceLineVisible:false,
      lastValueVisible:false}).setData(ma2(cd,5));
    mChart.addLineSeries({color:'#bc8cff',lineWidth:1,priceLineVisible:false,
      lastValueVisible:false}).setData(ma2(cd,20));
    if(avg>0)cs.createPriceLine({price:avg,color:'#8b949e',lineStyle:2,
      axisLabelVisible:true,title:'평단'});
    mVol=LightweightCharts.createChart(document.getElementById('mainVol'),
      {...opt,height:70,timeScale:{visible:false}});
    mVol.addHistogramSeries({priceFormat:{type:'volume'}}).setData(vd);
    mChart.timeScale().fitContent();mVol.timeScale().fitContent();
    mChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{
      if(r&&mVol)mVol.timeScale().setVisibleLogicalRange(r);});
    // 실시간 갱신: 마지막 봉 업데이트
    if(window._liveT)clearInterval(window._liveT);
    window._liveT=setInterval(async()=>{
      if(document.hidden)return;
      const fresh=await fetchChart(sym, mainPeriod);
      if(!fresh.length||!mChart)return;
      chartCache[ck]=fresh;
      const last=fresh[fresh.length-1];
      try{
        cs.update({time:toTime(last,isMin),open:last.o,high:last.h,low:last.l,close:last.c});
      }catch(e){}
    }, isMin?10000:30000);
    timers.push(window._liveT);
  });
}
renderMainPeriods();

async function loadWatch(){
  try{const r=await fetch('/api/prices/stock');const j=await r.json();
    const items=Object.values(j.data||j.prices||{});
    wCnt.textContent=items.length+'종목';
    wl.innerHTML=items.length?items.slice(0,10).map(p=>{
      const c=Number(p.change_rate??p.change??0);
      return `<div class="wr" style="cursor:pointer" onclick="openChart('${p.symbol}','${(p.name||p.symbol).replace(/'/g,"")}')">
        <b style="color:var(--br)">${p.name||p.symbol} <span style="color:var(--dim);font-size:10px">📈</span></b>
        <span class="mono">${won(p.price)} <b class="${cls(c)}">${pct(c)}</b></span></div>`;
    }).join(''):'<div class="empty">감시 없음</div>';
  }catch(e){}
}

async function loadPlan(){
  try{const r=await fetch('/api/jarvis/plan');const j=await r.json();
    document.getElementById('plan').textContent=(j.plan||'작전 없음 (08:30 자동 수립)').slice(0,700);
  }catch(e){}
}

async function loadTl(){
  try{const r=await fetch('/api/journal?days=1');const j=await r.json();const d=j.data||[];
    tl.innerHTML=d.length?d.slice(0,15).map(x=>{
      const t=new Date(x.ts);
      const pill=x.source==='chat'?'<span class="pill pm">수동</span>'
        :x.jarvis_decision==='SKIP'?'<span class="pill ps">SKIP</span>'
        :x.jarvis_decision==='EXECUTE_SMALL'?'<span class="pill pm">SMALL</span>'
        :'<span class="pill pe">EXECUTE</span>';
      const ev=(x.eval_pnl_rate!=null)?`<b class="${cls(x.eval_pnl_rate)}">${pct(x.eval_pnl_rate)}</b>`:'-';
      return `<tr><td class="mono">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</td>
        <td><b style="color:var(--br)">${x.name||x.symbol}</b></td><td>${pill}</td>
        <td style="color:var(--dim)">${x.strategy||''}</td><td>${ev}</td></tr>`;
    }).join(''):'<tr><td colspan="5" class="empty">오늘 판단 없음</td></tr>';
  }catch(e){}
}

async function loadBars(){
  try{const r=await fetch('/api/training/summary');const j=await r.json();
    const d=(j.daily||[]).slice(0,10).reverse();
    if(!d.length)return;
    const mx=Math.max(...d.map(x=>x.total),1);
    bars.innerHTML=d.map(x=>{
      const good=x.exec_hit+x.skip_good, bad=x.exec_miss+x.skip_missed;
      const gr=good/(good+bad||1);
      return `<div title="${x.date}: 좋음${good}/나쁨${bad}"
        style="height:${Math.max(8,x.total/mx*100)}%;
        background:linear-gradient(180deg,#3fb950 ${gr*100}%,#f6465d ${gr*100}%);"></div>`;
    }).join('');
  }catch(e){}
}

function all(){loadKpi();loadPos();loadWatch();loadTl();}
all();loadPlan();loadBars();
// 자비스 화면에서 예약한 차트 자동 오픈
try{
  const q=sessionStorage.getItem('open_chart_on_home');
  if(q){sessionStorage.removeItem('open_chart_on_home');
    const {sym,name,avg}=JSON.parse(q);
    setTimeout(()=>openChart(sym,name,avg), 400);}
}catch(e){}
window.regInterval(all, 15000);
})();
</script>
<!-- ── 차트 모달 ── -->
<div id="cm" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);
     align-items:center;justify-content:center;" onclick="if(event.target===this)closeChart()">
  <div style="width:min(1000px,92vw);max-height:92vh;overflow-y:auto;background:var(--p);
       border:1px solid var(--bd);border-radius:18px;padding:22px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="font-size:17px;font-weight:800;color:var(--br);" id="cmTitle">-</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div id="cmPeriods" style="display:flex;gap:6px;"></div>
        <button onclick="closeChart()" style="background:var(--bd);border:none;color:var(--tx);
          border-radius:8px;padding:7px 13px;font-size:13px;">✕</button>
      </div>
    </div>
    <div id="cmChart" style="height:380px;"></div>
    <div id="cmVol" style="height:90px;margin-top:4px;"></div>
    <div class="card" style="margin-top:14px;background:var(--p2);">
      <div class="ct">🤖 자비스 차트 리서치</div>
      <div id="cmAna" style="font-size:12.5px;line-height:1.9;white-space:pre-wrap;color:var(--tx);">분석 중...</div>
      <button onclick="askJarvis()" style="margin-top:12px;background:linear-gradient(145deg,var(--pu),#6d5fe0);
        border:none;border-radius:10px;color:#fff;padding:10px 18px;font-weight:700;">💬 자비스에게 더 물어보기</button>
    </div>
  </div>
</div>
<script>
(function(){
let lwLoaded=false, cmSym=null, cmName='', cmAvg=0, cmPeriod='D', chart=null, volChart=null;
function loadLW(cb){
  if(window.LightweightCharts){lwLoaded=true;cb();return;}
  const s=document.createElement('script');
  s.src='https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';
  s.onload=()=>{lwLoaded=true;cb();};
  document.head.appendChild(s);
}
window.openChart=function(sym,name,avg){
  cmSym=sym;cmName=name;cmAvg=avg||0;cmPeriod='D';
  document.getElementById('cm').style.display='flex';
  document.getElementById('cmTitle').textContent=`📈 ${name} (${sym})`;
  renderPeriods();
  loadLW(()=>drawCm());
  fetch(`/api/chart/analysis/${sym}`).then(r=>r.json()).then(j=>{
    document.getElementById('cmAna').textContent=j.analysis||'분석 실패';
  }).catch(()=>{});
};
window.closeChart=function(){
  document.getElementById('cm').style.display='none';
  if(chart){chart.remove();chart=null;}
  if(volChart){volChart.remove();volChart=null;}
};
function renderPeriods(){
  const P={'1m':'1분','5m':'5분','D':'일봉','W':'주봉','M':'월봉'};
  document.getElementById('cmPeriods').innerHTML=Object.entries(P).map(([k,v])=>
    `<button onclick="setPeriod('${k}')" style="background:${k===cmPeriod?'var(--gd)':'var(--bd)'};
     color:${k===cmPeriod?'#000':'var(--tx)'};border:none;border-radius:8px;padding:7px 13px;
     font-size:12px;font-weight:700;">${v}</button>`).join('');
}
window.setPeriod=function(pd){cmPeriod=pd;renderPeriods();drawCm();};
function ma(data,n){
  const out=[];for(let i=n-1;i<data.length;i++){
    let s=0;for(let k=i-n+1;k<=i;k++)s+=data[k].close;
    out.push({time:data[i].time,value:s/n});}
  return out;
}
async function drawCm(){
  const days=cmPeriod==='D'?120:cmPeriod==='W'?350:600;
  let rows=[];
  try{const r=await fetch(`/api/chart/${cmSym}?period=${cmPeriod}&days=${days}`);
    const j=await r.json();rows=j.data||[];}catch(e){}
  if(chart){chart.remove();chart=null;}
  if(volChart){volChart.remove();volChart=null;}
  if(!rows.length)return;
  const fmt=d=>`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
  const cd=rows.map(r=>({time:fmt(r.d),open:r.o,high:r.h,low:r.l,close:r.c}));
  const vd=rows.map(r=>({time:fmt(r.d),value:r.v,
    color:r.c>=r.o?'rgba(246,70,93,.55)':'rgba(56,139,253,.55)'}));
  const opt={layout:{background:{color:'transparent'},textColor:'#8b949e'},
    grid:{vertLines:{color:'#1c2129'},horzLines:{color:'#1c2129'}},
    crosshair:{mode:0},timeScale:{borderColor:'#21262d'},
    rightPriceScale:{borderColor:'#21262d'}};
  chart=LightweightCharts.createChart(document.getElementById('cmChart'),
    {...opt,height:380});
  const cs=chart.addCandlestickSeries({upColor:'#f6465d',downColor:'#388bfd',
    borderUpColor:'#f6465d',borderDownColor:'#388bfd',
    wickUpColor:'#f6465d',wickDownColor:'#388bfd'});
  cs.setData(cd);
  chart.addLineSeries({color:'#e3b341',lineWidth:1.5,priceLineVisible:false,
    lastValueVisible:false}).setData(ma(cd,5));
  chart.addLineSeries({color:'#bc8cff',lineWidth:1.5,priceLineVisible:false,
    lastValueVisible:false}).setData(ma(cd,20));
  if(cmAvg>0)cs.createPriceLine({price:cmAvg,color:'#8b949e',lineStyle:2,
    axisLabelVisible:true,title:'평단'});
  volChart=LightweightCharts.createChart(document.getElementById('cmVol'),
    {...opt,height:90,timeScale:{visible:false}});
  volChart.addHistogramSeries({priceFormat:{type:'volume'}}).setData(vd);
  chart.timeScale().fitContent();
  volChart.timeScale().fitContent();
  // 시간축 동기화
  chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{
    if(r&&volChart)volChart.timeScale().setVisibleLogicalRange(r);});
}
window.askJarvis=function(){
  sessionStorage.setItem('jarvis_prefill',`${cmName} 차트 분석 더 자세히 해줘. 매수 타이밍인가?`);
  closeChart();go('jarvis');
};
})();
</script>

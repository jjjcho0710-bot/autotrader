<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AutoTrader — 코인</title>
<style>
:root[data-theme="dark"]{--bg:#0d1421;--panel:#1a2332;--card:#1e2d40;--border:#2a3a4e;--text:#e8edf3;--muted:#8b95a1;--up:#f75467;--dn:#4386f9;--accent:#1763b6;--header:#111827;--green:#22c55e;--input:#243447;--badge:#243447;}
:root[data-theme="light"]{--bg:#f4f6f9;--panel:#ffffff;--card:#ffffff;--border:#e2e8f0;--text:#1a2332;--muted:#8b95a1;--up:#e02020;--dn:#1763b6;--accent:#1763b6;--header:#ffffff;--green:#16a34a;--input:#f4f6f9;--badge:#f0f4ff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Pretendard',sans-serif;font-size:14px;}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

.header{background:var(--header);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
.header-title{font-size:17px;font-weight:700;}
.theme-btn{background:none;border:none;cursor:pointer;font-size:18px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* 계좌 요약 */
.account-bar{background:var(--panel);padding:14px 16px;border-bottom:1px solid var(--border);}
.account-main{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.account-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.account-val{font-size:22px;font-weight:800;font-family:'SF Mono',monospace;}
.account-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sub-item{display:flex;flex-direction:column;gap:2px;}
.sub-label{font-size:10px;color:var(--muted);}
.sub-val{font-size:13px;font-weight:700;}

/* 탭 */
.tab-row{background:var(--panel);display:flex;border-bottom:2px solid var(--border);overflow-x:auto;white-space:nowrap;flex-shrink:0;}
.tab-btn{padding:10px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;flex-shrink:0;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}

/* 섹션 */
.section{padding:12px;}

/* 보유 카드 */
.pos-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);margin-bottom:10px;}
.pos-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.pos-coin-info{display:flex;flex-direction:column;gap:3px;}
.pos-coin-name{font-size:16px;font-weight:800;}
.pos-coin-sym{font-size:11px;color:var(--muted);}
.pos-rate-big{font-size:20px;font-weight:800;}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pos-gi{display:flex;flex-direction:column;gap:3px;}
.pos-gi-label{font-size:10px;color:var(--muted);font-weight:600;}
.pos-gi-val{font-size:14px;font-weight:700;font-family:'SF Mono',monospace;}

/* 감시 종목 */
.watch-col{display:grid;grid-template-columns:1fr 90px 65px;padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel);}
.watch-row{display:grid;grid-template-columns:1fr 90px 65px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--panel);align-items:center;}
.watch-row:active{background:var(--card);}
.coin-name{font-size:13px;font-weight:700;}
.coin-sym{font-size:10px;color:var(--muted);}
.watch-price{text-align:right;font-size:13px;font-weight:700;font-family:'SF Mono',monospace;}
.watch-rate{text-align:right;font-size:12px;font-weight:700;}

/* 신호 카드 */
.signal-card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.sig-left{display:flex;flex-direction:column;gap:4px;}
.sig-coin{font-size:14px;font-weight:700;}
.sig-sub{font-size:11px;color:var(--muted);}
.sig-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.sig-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;}
.badge-buy{background:rgba(247,84,103,0.15);color:var(--up);}
.badge-sell{background:rgba(67,134,249,0.15);color:var(--dn);}
.badge-hold{background:var(--badge);color:var(--muted);}
.sig-prob{font-size:13px;font-weight:700;}

/* 거래 이력 */
.trade-item{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.trade-left{display:flex;flex-direction:column;gap:4px;}
.trade-coin{font-size:14px;font-weight:700;}
.trade-time{font-size:11px;color:var(--muted);}
.trade-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.trade-amount{font-size:14px;font-weight:700;}
.trade-pnl{font-size:12px;font-weight:700;}
.side-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;}
.side-buy{background:rgba(247,84,103,0.15);color:var(--up);}
.side-sell{background:rgba(67,134,249,0.15);color:var(--dn);}

.up{color:var(--up);}
.dn{color:var(--dn);}
.hidden{display:none!important;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.8;}

.bottom-nav{background:var(--header);border-top:1px solid var(--border);display:flex;height:56px;position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10px;font-weight:500;}
.bn-item.active{color:#f0b90b;}
.bn-icon{font-size:22px;line-height:1;}
</style>
</head>
<body>

<div class="header">
  <div style="width:44px"></div>
  <div class="header-title"><span class="live-dot"></span>코인</div>
  <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌙</button>
</div>

<!-- 계좌 요약 -->
<div class="account-bar">
  <div class="account-main">
    <div>
      <div class="account-label">총 보유자산</div>
      <div class="account-val" id="total-assets">-</div>
    </div>
    <div style="text-align:right">
      <div class="account-label">평가손익</div>
      <div class="account-val" id="total-pnl" style="font-size:18px">-</div>
    </div>
  </div>
  <div class="account-sub">
    <div class="sub-item">
      <span class="sub-label">보유 KRW</span>
      <span class="sub-val" id="krw-bal">-</span>
    </div>
    <div class="sub-item">
      <span class="sub-label">코인 평가</span>
      <span class="sub-val" id="coin-eval">-</span>
    </div>
    <div class="sub-item">
      <span class="sub-label">수익률</span>
      <span class="sub-val" id="pnl-rate">-</span>
    </div>
  </div>
</div>

<!-- 탭 -->
<div class="tab-row">
  <button class="tab-btn active" onclick="showTab('position',this)">보유자산</button>
  <button class="tab-btn" onclick="showTab('watchlist',this)">감시 종목</button>
  <button class="tab-btn" onclick="showTab('signal',this)">Jarvis 신호</button>
  <button class="tab-btn" onclick="showTab('trades',this)">거래내역</button>
</div>

<!-- 보유자산 -->
<div id="tab-position" style="flex:1;overflow-y:auto;">
  <div class="section" id="pos-list">
    <div class="empty">보유 코인 없음</div>
  </div>
</div>

<!-- 감시 종목 -->
<div id="tab-watchlist" class="hidden" style="flex:1;overflow-y:auto;">
  <div class="watch-col">
    <span>코인</span>
    <span style="text-align:right">현재가</span>
    <span style="text-align:right">전일대비</span>
  </div>
  <div id="watch-list"></div>
</div>

<!-- Jarvis 신호 -->
<div id="tab-signal" class="hidden" style="flex:1;overflow-y:auto;">
  <div class="section" id="signal-list">
    <div class="empty">신호 없음</div>
  </div>
</div>

<!-- 거래내역 -->
<div id="tab-trades" class="hidden" style="flex:1;overflow-y:auto;">
  <div class="section" id="trade-list">
    <div class="empty">거래 내역 없음</div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="/" class="bn-item active"><span class="bn-icon">⊞</span>홈</a>
  <a href="/strategy" class="bn-item"><span class="bn-icon">⚙️</span>전략</a>
  <a href="/jarvis.html" class="bn-item"><span class="bn-icon">🤖</span>자비스</a>
  <a href="/training" class="bn-item"><span class="bn-icon">🎓</span>트레이닝</a>
  <a href="/logs" class="bn-item"><span class="bn-icon">📋</span>로그</a>
</nav>

<script>
const API='';
const COIN_NAMES={'KRW-BTC':'비트코인','KRW-ETH':'이더리움','KRW-SOL':'솔라나','KRW-XRP':'리플','KRW-ADA':'에이다','KRW-DOGE':'도지코인','KRW-AVAX':'아발란체','KRW-DOT':'폴카닷','KRW-LINK':'체인링크','KRW-SUI':'수이','KRW-TRX':'트론','KRW-SHIB':'시바이누','KRW-ARB':'아비트럼','KRW-OP':'옵티미즘','KRW-NEAR':'니어','KRW-APT':'앱토스','KRW-SAND':'샌드박스'};

function fmt(n){return Number(n||0).toLocaleString();}
function fmtR(r){return (r>=0?'+':'')+parseFloat(r||0).toFixed(2)+'%';}

function toggleTheme(){
  const h=document.documentElement;const dark=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('theme-icon').textContent=dark?'☀️':'🌙';
  localStorage.setItem('theme',dark?'light':'dark');
}
const th=localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme',th);
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('theme-icon').textContent=th==='dark'?'🌙':'☀️';});

function showTab(tab,btn){
  ['position','watchlist','signal','trades'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    el.classList.add('hidden');
    el.style.flex='';
  });
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const active=document.getElementById('tab-'+tab);
  active.classList.remove('hidden');
  active.style.flex='1';
  if(btn)btn.classList.add('active');
}

async function loadPositions(){
  try{
    const r=await fetch(`${API}/api/positions/crypto`);
    const d=await r.json();
    const acc=d.account||{};
    const krw=acc.krw_balance||0;
    const coinEval=acc.coin_eval||0;
    const pnl=acc.pnl||0;
    const rate=acc.pnl_rate||0;

    document.getElementById('total-assets').textContent=fmt(Math.round(krw+coinEval))+'원';
    const tpEl=document.getElementById('total-pnl');
    tpEl.textContent=(pnl>=0?'+':'')+fmt(Math.round(pnl))+'원';
    tpEl.className='account-val '+(pnl>=0?'up':'dn');
    document.getElementById('krw-bal').textContent=fmt(Math.round(krw))+'원';
    document.getElementById('coin-eval').textContent=fmt(Math.round(coinEval))+'원';
    const prEl=document.getElementById('pnl-rate');
    prEl.textContent=fmtR(rate);
    prEl.className='sub-val '+(rate>=0?'up':'dn');

    const positions=d.data||[];
    const list=document.getElementById('pos-list');
    if(!positions.length){list.innerHTML='<div class="empty">보유 코인 없음<br><small>신호 발생 시 자동 매수됩니다</small></div>';return;}
    list.innerHTML=positions.map(p=>{
      const pr=parseFloat(p.pnl_rate||0);
      const cls=pr>=0?'up':'dn';
      const name=p.name||COIN_NAMES[p.symbol]||p.symbol;
      return `<div class="pos-card">
        <div class="pos-top">
          <div class="pos-coin-info">
            <div class="pos-coin-name">${name}</div>
            <div class="pos-coin-sym">${p.symbol}</div>
          </div>
          <div class="pos-rate-big ${cls}">${fmtR(pr)}</div>
        </div>
        <div class="pos-grid">
          <div class="pos-gi"><span class="pos-gi-label">보유수량</span><span class="pos-gi-val">${parseFloat(p.qty||0).toFixed(4)}</span></div>
          <div class="pos-gi"><span class="pos-gi-label">평균단가</span><span class="pos-gi-val">${fmt(p.avg_price)}</span></div>
          <div class="pos-gi"><span class="pos-gi-label">현재가</span><span class="pos-gi-val ${cls}">${fmt(p.cur_price)}</span></div>
          <div class="pos-gi"><span class="pos-gi-label">평가손익</span><span class="pos-gi-val ${cls}">${pr>=0?'+':''}${fmt(Math.round(p.pnl||0))}원</span></div>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function loadWatchlist(){
  try{
    const r=await fetch(`${API}/api/prices/crypto`);
    const d=await r.json();
    const list=document.getElementById('watch-list');
    const coins=Object.values(d.data||{});
    if(!coins.length){list.innerHTML='<div class="empty">데이터 없음</div>';return;}
    list.innerHTML=coins.map(c=>{
      const rate=parseFloat(c.change_rate||0);
      const cls=rate>=0?'up':'dn';
      const name=c.name||COIN_NAMES[c.symbol]||c.symbol;
      return `<div class="watch-row">
        <div><div class="coin-name">${name}</div><div class="coin-sym">${(c.symbol||'').replace('KRW-','')}/KRW</div></div>
        <div class="watch-price ${cls}">${fmt(c.price)}</div>
        <div class="watch-rate ${cls}">${fmtR(rate)}</div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function loadSignals(){
  try{
    const r=await fetch(`${API}/api/ml/predictions?asset=crypto`);
    const d=await r.json();
    const list=document.getElementById('signal-list');
    const data=d.data||[];
    if(!data.length){list.innerHTML='<div class="empty">신호 없음</div>';return;}
    list.innerHTML=data.map(s=>{
      const cls=s.signal==='BUY'?'badge-buy':s.signal==='SELL'?'badge-sell':'badge-hold';
      const name=COIN_NAMES[s.symbol]||s.symbol;
      return `<div class="signal-card">
        <div class="sig-left">
          <div class="sig-coin">${name}</div>
          <div class="sig-sub">${s.symbol} · ML 예측</div>
        </div>
        <div class="sig-right">
          <span class="sig-badge ${cls}">${s.signal}</span>
          <span class="sig-prob">${((s.buy_prob||0)*100).toFixed(0)}%</span>
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function loadTrades(){
  try{
    const r=await fetch(`${API}/api/trades?bot=crypto_trader&limit=30`);
    const d=await r.json();
    const list=document.getElementById('trade-list');
    const data=d.data||[];
    if(!data.length){list.innerHTML='<div class="empty">거래 내역 없음</div>';return;}
    list.innerHTML=data.map(t=>{
      const isBuy=t.side==='BUY';
      const name=COIN_NAMES[t.symbol]||t.symbol;
      const time=new Date(t.ts||t.created_at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      const pnl=parseFloat(t.pnl||0);
      return `<div class="trade-item">
        <div class="trade-left">
          <div class="trade-coin">${name} <span class="side-badge ${isBuy?'side-buy':'side-sell'}">${t.side}</span></div>
          <div class="trade-time">${time} · ${t.strategy||''}</div>
        </div>
        <div class="trade-right">
          <div class="trade-amount">${fmt(Math.round(t.amount||0))}원</div>
          ${pnl?`<div class="trade-pnl ${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${fmt(Math.round(pnl))}원</div>`:''}
        </div>
      </div>`;
    }).join('');
  }catch(e){}
}

async function loadAll(){
  await Promise.all([loadPositions(),loadWatchlist(),loadSignals(),loadTrades()]);
}
loadAll();
setInterval(loadPositions,10000);
setInterval(loadWatchlist,5000);
</script>
</body>
</html>
